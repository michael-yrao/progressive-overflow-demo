# Canonical DSA technique vocabulary.
#
# The tracker (dsa_progress.md) is keyed by PROBLEM. This file is keyed by TECHNIQUE,
# and `scripts/technique_coverage.py` joins the two to produce technique_coverage.md.
#
# Schema
# ------
#   name          canonical technique name. This is the vocabulary — keep it stable;
#                 everything downstream keys off it.
#   family        grouping for the report, roughly the dsa/leetcode/<folder> pattern.
#   doc           the /learn cheat-sheet's join key: the technique doc's filename stem
#                 under docs/foundations/dsa/patterns/techniques/ (underscores, e.g.
#                 `doc: two_pointer`). scripts/build_cheatsheets.py reads a doc's family/
#                 tier by joining on this key and raises a hard BuildError if zero or more
#                 than one entry in this file carries a given `doc:` — a vocabulary bug,
#                 not a content gap. Exactly one entry per technique doc; not every entry
#                 needs one (sub-variant entries like "Binary Search on Answer" don't —
#                 the doc is joined once, from its single best-matching entry). See
#                 docs/foundations/dsa/patterns/README.md's "The machine-readable
#                 contract" section for the full contract.
#   min_problems  coverage bar. Defaults to 3 (a technique needs 3-4 surface forms before
#                 it is a skill rather than recall of one problem). Drop to 1-2 for
#                 patterns that are genuinely problem-specific — Dutch National Flag has
#                 exactly one canonical problem and flagging it "thin" forever is noise.
#   tier          curriculum tier, for the honest denominator: "core" (already-started
#                 NC150/pattern-doc techniques — the implicit default when a technique
#                 carries no `tier:` key, so pre-existing entries are not rewritten), "dp"
#                 (the DP framework lenses — knapsack, interval DP, LIS, LCS, space
#                 compression — plus core 1D/2D DP), "tier1" (Knowledge Expansion Queue,
#                 ABOVE the interview-ROI line — still shows up in hard interviews),
#                 "tier2"/"tier3" (BELOW the line — competitive-programming horizon only;
#                 see the "INTERVIEW-ROI LINE" marker below). A `tier` never changes a gap
#                 check — `is_started` already gates every check off techniques with zero
#                 `problems`, which is exactly the state every not-yet-started entry is
#                 declared in. Tiering only lets the dashboard show breadth split as
#                 "practiced · above the line · below the line" instead of one flat
#                 fraction that reads misleadingly high or low either way.
#   variants      alternative METHODS for the same technique, when exercising both is
#                 worth an interview rep. A variant with zero problems is a gap.
#                 `queued: <trigger>` marks one already sitting in the Waiting Room or
#                 Expansion Queue, so a known gap is not re-reported as a new finding.
#                 Trigger vocabulary matches dsa_progress.md: graduates:<n>, rated:<n>,
#                 surplus>=<n>, phase:<Name>, combined with +.
#   problems      list of {number, method?, variant?, review?}
#                   number   LeetCode number — the join key, same as the tracker
#                   method   match ONLY the tracker row whose title parenthetical equals
#                            this. Required for problems carrying several rows (200 has
#                            DFS + BFS, 323 has DFS + BFS + Union-Find). Omit to match
#                            every row for that number.
#                   variant  which declared variant this row credits. Defaults to
#                            `method` — set it explicitly when the row has no
#                            parenthetical but the method is known (269 is Kahn's).
#                   review   true = the method here is an ASSUMPTION, because the tracker
#                            row carries no parenthetical. Confirm, add the parenthetical
#                            to the tracker, then drop this flag.
#
# Adding a solved problem here is not optional bookkeeping: the report lists every
# unmapped tracker row, so anything left out shows up as a gap in the vocabulary itself.

