# Learner overlay on the DSA technique catalogue.
#
# The catalogue (curriculum/dsa/techniques.yml, synced from cse-coach — never edit it here) owns
# every technique's name, family, tier, doc, builds_on and min_problems, plus each declared
# problem's number, method, title, url and difficulty. This file holds only what is yours.
# scripts/curriculum.py `load_techniques` merges it over the catalogue:
#   - an entry whose `name` is in the catalogue: its `problems:` specs are matched to the
#     catalogue's by (number, method) and merged in place (`queued`, `planned`, `review`); an
#     unmatched spec (your custom problem, numbers 9001-9999) is appended after the catalogue's
#     specs. Its `variants:` are matched by `name` the same way (`queued`).
#   - an entry whose `name` is not in the catalogue: appended after every catalogue entry, as
#     written — a technique only you track.
#   - any other key on an entry for a catalogue name is ignored.
# The trigger vocabulary for `queued` is documented in the catalogue's header.

version: 1

techniques: []
