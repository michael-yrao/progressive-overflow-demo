# DSA milestone curriculum — NeetCode 150, undated.
# The bootstrap projects these phases onto real dates from start_date using each
# phase's difficulty_tier → tier_pace (new problems/week). Ordering is the standard
# NeetCode learning order (each phase leans on the prior). Tier = milestone
# (interview foundation, above the ROI line).
#
# DIFFICULTY TIER drives intake pace — this is the single knob for how fast a phase
# is taken on. Harder categories default to FEWER new/week because of the "blank tax":
# a new problem in a hard category almost always logs 🔴 on first exposure (a new
# algorithm per problem), and every 🔴 spawns a +2-day retry that eats a warmup slot,
# so one hard new problem is really ~3 slots over its first fortnight. Capping harder
# phases lower keeps that cascade from starving the review backlog. To re-pace a phase,
# change its `difficulty_tier` (or set an explicit `pace_per_week:` to override). Mirrors
# the learner config `new_problem_intake`.
pillar: dsa
tier: milestone
roi: above_line
tier_pace:                 # new problems/week by difficulty tier (override per-phase with pace_per_week)
  moderate: 5              # pattern reused across problems; first attempt often 🟡 not 🔴
  hard:     4              # a new algorithm per problem (graphs, backtracking); first try ~🔴
  hardest:  3              # DP and the like — hardest + slowest, highest blank rate
default_pace_per_week: 5   # fallback when a phase names no tier

