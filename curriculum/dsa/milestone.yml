    # Prim/MST, Hierholzer, Floyd-Warshall) at a DP-level blank rate, so the +2 retry
    # cascade collides with review-saturated weeks. Keep intake at 3 so blanks settle.
    difficulty_tier: hardest
    problems:
      - { number: 332, title: "Reconstruct Itinerary", difficulty: Hard }
      - { number: 1584, title: "Min Cost to Connect All Points", difficulty: Medium }
      - { number: 743, title: "Network Delay Time", difficulty: Medium }
      - { number: 778, title: "Swim in Rising Water", difficulty: Hard }
      - { number: 269, title: "Alien Dictionary", difficulty: Hard }
      - { number: 787, title: "Cheapest Flights Within K Stops", difficulty: Medium }
      # --- Added Jul 26, 2026 under "ROI promotes to the curriculum" (SKILL.md §5).
      # NC150 is the FLOOR of the high-ROI set, not its ceiling. Both are non-NC150.
      - { number: 1334, title: "Find the City With the Smallest Number of Neighbors", difficulty: Medium, class: new_technique, note: "Floyd-Warshall. Closes a FAMILY gap, not just adds a problem: shortest path has four cases and NC150 covers three (BFS unweighted, Dijkstra non-negative, Bellman-Ford negatives/hop-cap) with all-pairs entirely absent. ~5 lines — the cheapest algorithm in the whole graph block." }
      - { number: 721, title: "Accounts Merge", difficulty: Medium, class: new_technique, note: "Perennial interview problem where Union-Find MECHANICS are the easy half and the MODELING is the test (the node is an email, not an account). Mechanics are already covered by 323/684/261; this exercises the step they don't." }
      # --- Consolidation reps (SKILL.md §5): another problem in a technique already at 🟡+.
      # Separate <=2/wk budget, NOT against the difficulty cap. With 743 + 778 these give four
      # Dijkstra-family problems whose differences are what recognition grades: cost-as-sum,
      # cost-as-max, multiplicative-and-maximizing, hop-capped.
      - { number: 1631, title: "Path With Minimum Effort", difficulty: Medium, class: consolidation, requires: [778], note: "Dijkstra where path cost is a MAX over edges, not a sum (minimax path). Initially declined as 'near-duplicate of 778' and reversed the same day — similarity to a solved problem argues FOR scheduling, since the minor difference is the training signal." }
      - { number: 1514, title: "Path with Maximum Probability", difficulty: Medium, class: consolidation, requires: [743, 787], note: "Relaxation that MULTIPLIES and MAXIMIZES instead of adding and minimizing — proves the relaxation step isn't about addition but about a monotonic combine." }

