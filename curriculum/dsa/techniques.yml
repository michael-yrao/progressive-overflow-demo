# Canonical DSA technique catalogue.
#
# ENGINE-OWNED: this file ships with cse-coach and reaches a learner through ENGINE_PATHS'
# `curriculum/**/*.yml`, so a learner never edits it. The LEARNER OVERLAY at
# docs/foundations/dsa/mastery/techniques.yml holds everything personal and is merged over this
# file by `scripts/curriculum.py` `load_techniques` (see "Overlay" below).
#
# The tracker (dsa_progress.md) is keyed by PROBLEM. This file is keyed by TECHNIQUE,
# and `scripts/technique_coverage.py` joins the two to produce technique_coverage.md.
#
# Schema
# ------
#   name          canonical technique name. This is the vocabulary — keep it stable;
#                 everything downstream keys off it.
#   family        grouping for the report, roughly the dsa/leetcode/<folder> pattern.
#   doc           the /learn cheat-sheet's join key (Sep 23, 2026 — see
#                 docs/cse-coach/learn_cheatsheet_plan.md): the technique doc's filename
#                 stem under docs/foundations/dsa/patterns/techniques/ (underscores, e.g.
#                 `doc: two_pointer`). scripts/build_cheatsheets.py reads a doc's family/
#                 tier by joining on this key and raises a hard BuildError if zero or more
#                 than one entry in this file carries a given `doc:` — a vocabulary bug,
#                 not a content gap. Exactly one entry per technique doc (18 docs today);
#                 not every entry needs one (sub-variant entries like "Binary Search (min
#                 boundary)" don't — the doc is joined once, from its single best-matching
#                 entry).
#   min_problems  OPTIONAL manual override of the coverage bar's computed floor (decision
#                 `coverage-threshold-formula-sep27`). Without it, `technique_coverage.py`
#                 sizes the floor off this entry's own declared problem count, per
#                 `cse.config.yml`'s `coverage_threshold` (plan_share/floor_min/floor_max);
#                 a technique's still-🔴/🟡 problems are always added on top of the floor,
#                 override or not. Set this only when the formula's floor doesn't fit a
#                 technique's actual shape (e.g. it is genuinely problem-specific, like
#                 Dutch National Flag, or the learner wants more/less drilling than the
#                 formula gives it).
#   tier          curriculum tier, for the HONEST denominator (Sep 21, 2026): "core"
#                 (already-started NC150/pattern-doc techniques — the implicit default
#                 when a technique carries no `tier:` key), "dp" (the DP framework lenses —
#                 knapsack, interval DP, LIS, LCS, space compression — plus core 1D/2D DP),
#                 "tier1" (Knowledge Expansion Queue, ABOVE the interview-ROI line — still
#                 shows up in hard interviews), "tier2"/"tier3" (BELOW the line —
#                 competitive-programming horizon only). See study_guide.md's
#                 "Interview-ROI Line". A `tier` never changes a gap check — `is_started`
#                 already gates every check off techniques with zero `problems`. Tiering
#                 only lets the dashboard show breadth as "N practiced · N above the line ·
#                 M below" instead of one flat fraction that reads misleadingly high OR low
#                 either way.
#   builds_on     optional list of technique `name`s this technique PRESUPPOSES (Sep 26,
#                 2026 — the site's skill tree). Each name must already exist as a `name:`
#                 in this file; no self-reference; the graph must stay ACYCLIC (checked by
#                 scripts/test_gamify.py's PayloadTests against the live file, not just the
#                 authored list here). A technique with no `builds_on` is a ROOT of the
#                 tree. Consumed by scripts/gamify.py's `enrich_techniques()` -> `buildsOn`
#                 in progress.json/-summary.json.
#   variants      alternative METHODS for the same technique, when exercising both is
#                 worth an interview rep. A variant with zero problems is a gap.
#                 The learner overlay's variant `queued: <trigger>` marks one already
#                 sitting in the Waiting Room or Expansion Queue, so a known gap is not
#                 re-reported as a new finding. Trigger vocabulary matches dsa_progress.md:
#                 graduates:<n>, rated:<n>, surplus>=<n>, phase:<Name>, combined with +.
#   problems      list of {number, method?, variant?, title, url, difficulty}
#                   number      LeetCode number — the join key, same as the tracker
#                   method      match ONLY the tracker row whose title parenthetical equals
#                               this. Required for problems carrying several rows (200 has
#                               DFS + BFS, 323 has DFS + BFS + Union-Find). Omit to match
#                               every row for that number.
#                   variant     which declared variant this row credits. Defaults to
#                               `method` — set it explicitly when the row has no
#                               parenthetical but the method is known (269 is Kahn's).
#                   title       the problem's title, so a planned problem with no Waiting
#                   url         Room row and no roadmap.yml row still shows a name, a link
#                   difficulty  and a difficulty on the dashboard, for every learner.
#                               Easy / Medium / Hard. Taken from the practice spec.
#
# Overlay
# -------
# The learner overlay (docs/foundations/dsa/mastery/techniques.yml) carries what is personal:
#   - `queued`, `planned`, `review` on a `problems:` spec, matched to a spec here by
#     (number, method) and merged into it:
#       queued   <trigger> — declared, no tracker row yet, waiting on this trigger. Reported
#                in the Gaps cell and the Action list rather than silently falling into "not
#                reached yet". OPTIONAL on an untracked spec: a spec with no tracker row and
#                no `queued` key is still counted in the site's `planned` via gamify.py's
#                `planned_for()`, with `trigger: null`.
#       planned  false = declared for credit if it ever earns a tracker row, but NOT part of
#                the plan: excluded from the dashboard's planned list and from plannedTotal.
#                Use for a recognition probe. When a number has several specs in one entry,
#                it is excluded only when EVERY untracked spec for that number carries
#                `planned: false`.
#       review   true = the method here is an ASSUMPTION, because the tracker row carries no
#                parenthetical. Confirm, add the parenthetical to the tracker, then drop it.
#   - `queued` on a variant, matched by `name`.
#   - the learner's own custom-problem specs (numbers 9001-9999), appended after this
#     file's specs for that technique.
#   - learner-local techniques whose `name` this file lacks, appended after all entries here.
# Any other key on an overlay entry for a name in this file is ignored; this file owns family,
# tier, doc, builds_on and min_problems.
#
# Adding a solved problem here is not optional bookkeeping: the report lists every
# unmapped tracker row, so anything left out shows up as a gap in the vocabulary itself.

