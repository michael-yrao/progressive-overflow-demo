  # ── Intervals ───────────────────────────────────────────────────────────────
  # Phase "Intervals + Greedy" opened Aug 24, 2026.
  # The flavours are keyed by SORT KEY + ANSWER SHAPE, which is also the recognition
  # discriminator: sort by START when the answer is a SET OF INTERVALS (union work),
  # sort by END when the answer is a COUNT OF INTERVALS KEPT (scheduling), sweep-line
  # when the answer is a COUNT OF SIMULTANEOUS things. Declared Aug 28, 2026 — before
  # that this technique carried no `variants:` at all, so the report read `3 (56,57,435)`
  # with the bar met and could not surface a breadth gap even in principle.
  #
  # Split into four techniques on Oct 6, 2026 (decision `intervals-split-four-ways-oct6`):
  # sort key + answer shape is the recognition discriminator, so each flavour gets its own
  # bar ("there are flavors of intervals"). Only the first entry carries `doc: intervals`
  # (one entry per technique doc; build_cheatsheets.py joins on it).
  - name: "Intervals: Merge & Insert (sort by start)"
