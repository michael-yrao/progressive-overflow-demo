  # ── Binary search ─────────────────────────────────────────────────────
  #
  # ⭐ TWO AXES, and they are independent (restructured Aug 30, 2026 at the learner's call).
  #
  #   AXIS 1 — WHAT YOU CONVERGE ON:  exact match | min boundary | max boundary
  #   AXIS 2 — WHAT YOU SEARCH OVER:  the array | the answer space  ("on answer", below)
  #
  # A problem is listed under one entry per axis it exercises, which the schema already
  # allows (74 was in two entries before this change). Learner, Aug 30: *"keep [on-answer]
  # as a second axis, harder problems typically have more than just one axis."*
  #
  # ⚠️ WHY THIS WAS RESTRUCTURED — the taxonomy was ASYMMETRIC and the asymmetry hid a gap.
  # `Binary Search (max boundary)` was already keyed on the BIAS and already spanned both
  # search spaces (74 array-space, 1552 answer-space). The min side was not keyed that way
  # at all: its answer-space half sat in `Binary Search on Answer` and its array-space half
  # was never named — it was diffused through a generic seven-problem `Binary Search` bucket
  # that also held the exact-match problems. So coverage reported "Binary Search: 7 problems,
  # healthy" and was structurally unable to answer *"how many min-boundary reps do I have?"*
  # — the identical failure the Aug 17 note below describes, mirrored onto the other bias.
  #
  # Found when 153 graduated (Aug 30) and the learner asked for coverage on both boundaries:
  # *"this is min boundary, max boundary is slightly different … our existing problem set
  # should have a lot of min boundary binary search since it is the default for most
  # non-exact match binary searches."* Correct, and none of it was visible from the file.
  - name: Binary Search (exact match)
    family: binary_search
    builds_on: ["Array/String Fundamentals"]
    doc: binary_search
    problems:
      - {number: 704, title: Binary Search, url: "https://leetcode.com/problems/binary-search/", difficulty: Easy}    # the base rung — target present or not
      - {number: 33, title: Search in Rotated Sorted Array, url: "https://leetcode.com/problems/search-in-rotated-sorted-array/", difficulty: Medium}     # rotated, still an exact-match target search

  # AXIS 1, min bias. The default shape for any non-exact-match search: you want the
  # SMALLEST value satisfying a monotone predicate, so the answer lives at `r` on exit and
  # the ordinary `m = (l + r) // 2` is correct. This is the bias the learner reaches for by
  # default, which is exactly why it needed naming — an unnamed default is unmeasurable.
  #
  # ⚠️ 875 and 1011 are ALSO on the second axis (`Binary Search on Answer`). They are
  # min-boundary practice regardless of searching the answer space rather than an array —
  # that was the learner's Aug 30 point and it is why they are listed here too.
  - name: Binary Search (min boundary)
    family: binary_search
    builds_on: ["Binary Search (exact match)"]
    problems:
      - {number: 153, title: Find Minimum in Rotated Sorted Array, url: "https://leetcode.com/problems/find-minimum-in-rotated-sorted-array/", difficulty: Medium}    # first index of the rotation — Graduated Aug 30
      - {number: 2300, title: Successful Pairs of Spells and Potions, url: "https://leetcode.com/problems/successful-pairs-of-spells-and-potions/", difficulty: Medium}   # first potion index that clears the threshold
      - {number: 162, title: Find Peak Element, url: "https://leetcode.com/problems/find-peak-element/", difficulty: Medium}    # first index where the sequence turns — peak
      - {number: 540, title: Single Element in a Sorted Array, url: "https://leetcode.com/problems/single-element-in-a-sorted-array/", difficulty: Medium}    # first index where pair-start parity breaks (learner's call, Aug 30)
      - {number: 34, title: Find First and Last Position of Element in Sorted Array, url: "https://leetcode.com/problems/find-first-and-last-position-of-element-in-sorted-array/", difficulty: Medium}     # the first-position half — clean cold; last-position half taught (done Sep 6)
      - {number: 875, title: Koko Eating Bananas, url: "https://leetcode.com/problems/koko-eating-bananas/", difficulty: Medium}    # => also axis 2 — smallest k that works
      - {number: 1011, title: Capacity To Ship Packages Within D Days, url: "https://leetcode.com/problems/capacity-to-ship-packages-within-d-days/", difficulty: Medium}   # => also axis 2 — smallest capacity that works
      # Declared Sep 26, 2026 (decision `mastery-ratio-done-over-planned-sep26`) — roadmap.yml.
      - {number: 4, title: Median of Two Sorted Arrays, url: "https://leetcode.com/problems/median-of-two-sorted-arrays/", difficulty: Hard}

  # AXIS 2 — the search space IS the answer, not an array you were handed. Kept as its own
  # entry rather than folded into the bias entries (learner's call, Aug 30): recognizing that
  # you must MANUFACTURE the search space is a distinct recognition skill from knowing which
  # bias to use once you have one. Fold it in and that signal becomes invisible.
  #
  # ⚠️ Bar was raised to the file default of 3 on Aug 16, 2026 (tier A/B of the coverage
  # review: a LeetCode topic tag exists that can actually source it).
  #
  # ⚠️ This entry held ONLY the two minimizing problems until Aug 30, which is what made the
  # axis read as a min-only concern. 1552 is answer-space with the MAX bias and belongs here
  # as much as 875 does; adding it is what makes this a real second axis rather than a
  # synonym for "min boundary on answer".
  - name: Binary Search on Answer
    family: binary_search
    builds_on: ["Binary Search (min boundary)"]
    problems:
      - {number: 875, title: Koko Eating Bananas, url: "https://leetcode.com/problems/koko-eating-bananas/", difficulty: Medium}    # => also axis 1, min
      - {number: 1011, title: Capacity To Ship Packages Within D Days, url: "https://leetcode.com/problems/capacity-to-ship-packages-within-d-days/", difficulty: Medium}   # => also axis 1, min
      - {number: 1552, title: Magnetic Force Between Two Balls, url: "https://leetcode.com/problems/magnetic-force-between-two-balls/", difficulty: Medium}   # => also axis 1, max — maximize the minimum gap
      - {number: 3620, title: Network Recovery Pathways, url: "https://leetcode.com/problems/network-recovery-pathways/", difficulty: Hard}   # => also axis 1, max — the check is a Dijkstra on cost ≤ k

  # Added Aug 17, 2026. The learner noticed 69 was only their SECOND max-boundary rep and
  # asked to fill the technique — and nothing in the repo could have surfaced that, because
  # the vocabulary had no entry for it: 74 sat inside the generic `Binary Search` bucket
  # among seven problems, and `Binary Search on Answer` holds only minimizing forms.
  #
  # What makes it one technique rather than a detail of the others: you are looking for the
  # LARGEST value that still satisfies a monotone predicate, so the answer lives at `l` on
  # exit and the midpoint must round UP — `m = (l + r + 1) // 2`. With the ordinary
  # `(l + r) // 2` the search stalls on a two-element window and loops forever. That single
  # bias is the whole technique and it is invisible from the minimizing side.
  #
  # ⚠️ 69 Sqrt(x) is deliberately NOT listed. It was a 🟢 recognition probe, so by the probe
  # rule it has no tracker row — declaring it here would report it forever as "not reached".
  # The consequence is real and worth stating: coverage credits this technique with 74 only,
  # so the two problems below are what actually close it.
  - name: Binary Search (max boundary)
    family: binary_search
    builds_on: ["Binary Search (exact match)"]
    problems:
      - {number: 74, title: Search a 2D Matrix, url: "https://leetcode.com/problems/search-a-2d-matrix/", difficulty: Medium}     # largest row whose first element <= target
      - {number: 34, title: Find First and Last Position of Element in Sorted Array, url: "https://leetcode.com/problems/find-first-and-last-position-of-element-in-sorted-array/", difficulty: Medium}     # both boundaries in one problem — the two biases side by side (done Sep 6, 🟡)
      - {number: 1552, title: Magnetic Force Between Two Balls, url: "https://leetcode.com/problems/magnetic-force-between-two-balls/", difficulty: Medium}   # ⏳ maximize the minimum gap — => also axis 2 (on answer)
      - {number: 3620, title: Network Recovery Pathways, url: "https://leetcode.com/problems/network-recovery-pathways/", difficulty: Hard}   # largest score T whose Dijkstra check still says yes — => also axis 2

