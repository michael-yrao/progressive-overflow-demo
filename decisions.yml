  - id: coverage-queued-problems-sep26
    date: 2026-09-26
    summary: >-
      ADDS a `queued:` key on a `techniques.yml` `problems:` spec (the vocabulary a `variants:`
      entry already used), so a declared problem with no tracker row yet, but already sitting in
      the Waiting Room / Expansion Queue behind a stated trigger, is reported as a KNOWN gap
      (named in the Gaps cell and a "Queued" Action-list block) instead of silently folding into
      "not reached yet". "Not reached yet" itself splits into "Queued (N)" and "Declared, not
      queued (N): <numbers>" (listed, not just counted). `Resolved.queued_problems: dict[int,
      str]` in `scripts/technique_coverage.py`; a `queued:` key on a spec that DOES match a
      tracker row is a no-op, never an error. Rendered strictly INSIDE the existing Gaps cell,
      never a new column, never in the Problems cell's parenthetical, and never containing the
      word "variant" (which `gamify.parse_techniques()` reads as a substring to flag
      `hasVariantGap`), so the `## Coverage` table's 9-column contract and gamify's header-count
      regex are unchanged. `scripts/test_technique_coverage.py` uses string fixtures with
      monkeypatched path constants, never the live repo files. No `cse.config.yml` value changed.
      See `scripts/technique_coverage.py`, `docs/foundations/dsa/mastery/techniques.yml` (schema
      comment), `.claude/skills/cse-coach/references/technique-coverage.md`.
    affects: [technique_coverage]

  - id: coverage-threshold-formula-sep27
    date: 2026-09-27
    summary: >-
      REPLACES the per-technique coverage bar's hand-set `min_problems` (a flat default
      individually overridden on most entries) with a COMPUTED threshold. A single fixed default
      did not fit a vocabulary spanning techniques with one declared problem and techniques with a
      dozen: the flat number was either too loose on a thin technique or too tight on a broad
      one, and each mismatch was patched by hand, forever. FORMULA (`cse.config.yml`'s
      `coverage_threshold` block: `plan_share`, `floor_min`, `floor_max`):
      floor = clamp(ceil(plan_share * declared), floor_min, floor_max); threshold = floor +
      unclean. `declared` is the technique's own distinct declared problem count
      (`techniques.yml` `problems:`, excluding a number whose every spec opts out via `planned:
      false`). `unclean` is how many of the technique's CREDITED problems (tracker-matched,
      distinct numbers) are still red or yellow best comfort, added on top of the floor because a
      shaky rep has not earned its coverage credit yet. A technique's own `min_problems:`, when
      present, REPLACES the formula's floor only; `unclean` is still added on top. BASIS: the
      N-consecutive-correct rule tutoring systems use for mastery (applied at the technique level
      via `unclean`, as `graduate_at_streak` applies it to a single problem), and a bar sized as a
      SHARE of what is planned for that technique rather than a constant. Declared variations,
      difficulty and company demand are DELIBERATELY left out: variations are a separate
      per-technique gap check, and difficulty and demand size WHICH problems to pull, not how many
      count toward "covered". IMPLEMENTATION: `scripts/technique_coverage.py`
      `compute_coverage_threshold()` (pure, table-tested) returns `(floor, threshold)`; `Resolved`
      gains `coverage_floor` and `unclean_count`; the Min column renders `threshold
      (floor+unclean)`, still readable by `gamify.parse_techniques()` as the first integer in the
      cell, extended to read the two parenthesised integers into `coverageFloor` /
      `uncleanCount` (additive). `company_demand.py` and `technique_comfort_audit.py` pass the
      loaded `coverage_threshold` config through unchanged.
    affects: [technique_coverage, gamify, mastery]

  - id: mastery-ratio-done-over-planned-sep26
    date: 2026-09-26
    summary: >-
      CHANGES the Mastery tab's ratio from `problemCount/minProblems` (tracked vs. an internal
      coverage bar) to `z/y`, done over planned, so the number on the page answers "how many of
      what is coming have I done" instead of comparing against a bar the learner has never seen.
      DEFINITIONS. z (done): any problem with a rating counts as attempted, once per problem
      (this is `problemCount`). y (planned): every problem planned for the technique, done ones
      included: `y = problemCount + len(planned)`, where `planned` holds EVERY declared-untracked
      problem in `techniques.yml`, not only ones carrying a `queued:` trigger; a problem declared
      under two techniques counts once in each. x (threshold): unchanged (`min_problems`), now
      shown as a tick on a progress bar under the row rather than folded into the ratio; x > y is
      a real finding, shown honestly. THE CATALOG. Most declared-untracked problems resolve their
      title through the tracker's Waiting Room table (`parse_waiting_room`); the rest resolve
      through `docs/foundations/dsa/mastery/roadmap.yml`, a catalog of `{number, title, url,
      difficulty, phase}`. `scripts/gamify.py` `load_roadmap(warnings)` (fail-soft) is
      `planned_for`'s SECOND fallback source (Waiting Room first, catalog second, an honest null
      and one warning when neither has it, never guessed). OPT-OUT. A `problems:` spec takes an
      optional `planned: false`: declared for credit if it ever earns a tracker row, but excluded
      from `planned` / `plannedTotal` (a recognition probe is the case); `planned_for` excludes a
      number only when EVERY untracked spec for it carries `planned: false`. `queued` is OPTIONAL
      on an untracked spec: its only remaining job is which bucket `technique_coverage.py` sorts
      an unmatched spec into. CONTRACT FIELDS (additive, no `SCHEMA_VERSION` bump):
      `plannedTotal` (= y, exported so the site never re-derives it) and `untriedVariations`
      (names of a declared method variant never exercised and not queued, parsed from
      `technique_coverage.md`'s Variants cell via `gamify._parse_untried_variants`).
      OUT OF SCOPE: the Knowledge Expansion Queue tiers, a backlog rather than a plan with
      dates. See `scripts/gamify.py`, `scripts/test_gamify.py`, `dashboard/progress.schema.json`
      (`definitions.technique.planned` / `plannedTotal` / `untriedVariations`),
      `.claude/skills/cse-coach/references/technique-coverage.md`.
    affects: [gamification, technique_coverage, dsa_progress, waiting_room, roadmap]

  - id: company-demand-families-sep26
    date: 2026-09-26
    summary: >-
      ADDS `scripts/company_demand.py` -> `docs/foundations/dsa/mastery/company_demand.md`:
      per-tier demand from the public company-wise question lists, joined to `techniques.yml`
      families. Run by hand at the weekly build (`python scripts/company_demand.py --tier all`);
      it needs the network, so it is NOT wired into the pre-commit hook (unlike
      `technique_coverage.py`). Four `tier: core` families back the report's vocabulary:
      `strings`, `math_sim`, `design`, `bit_manipulation`. The report's per-family demand is
      lower than a raw tag share because a multi-tag problem is assigned ONE family by
      `FAMILY_PRIORITY`, and a tracked problem takes the family of its vocabulary credit. Rule: a
      demand family with no vocabulary entry is a `NO FAMILY` verdict in `company_demand.md`,
      fixed by adding the `techniques.yml` entry, never by scheduling a problem reactively off the
      report. Sorting is not added: the family already exists. FIXES
      `pull_interview.read_tracker()`'s comfort-emoji alternation, which omitted the graduated
      mark and silently dropped every graduated row from both `solved_slugs` and
      `learned_numbers`; also adds `"Strings"` / `"Design"` to `CATEGORY_TO_TOPICS` and
      `FOLDER_TO_CATEGORY` (inert until a solution folder exists for either). See
      `scripts/company_demand.py`, `scripts/pull_interview.py`, `docs/foundations/dsa/mastery/techniques.yml`.
    affects: [technique_coverage, gamification, pull_interview]

  - id: greedy-family-oct18
    date: 2026-10-18
    summary: >-
      MOVES `Greedy (single pass)` from family `sliding_window` to its own family `greedy` in
