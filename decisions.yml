  - id: dsa-mock-interview-sep30
    date: 2026-09-30
    summary: >-
      A recurring DSA mock interview joins the DSA pillar: every `dsa_mock.every_days`, one unseen
      Medium/Hard problem run cold as an interviewer, then a level raiser (a constraint change
      scored pass/partial/fail on an adaptability checklist). Seated Sunday as a mock row priced
