  - id: practice-figure-shapes-oct4
    date: 2026-10-04
    summary: >-
      EXTENDS the practice spec's `figure` for graphs. A graph figure takes exactly one edge
      source: `edgesArg` (edge list), `matrixArg` (square matrix, undirected) or `adjArg`
      (neighbour list, with `oneBased`). Nodes can be named: `nodesArg` names the argument that
