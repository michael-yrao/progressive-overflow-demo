      `techniques.yml` declares such a problem with `queued: "surplus>=1"` (see
      `coverage-queued-problems-sep26`); the tracker's Waiting Room row and the "Notes for future
      agents" legend carry the convention. Companion source fixes label problems by judge host and
      read the header URL for the auto-row (`scripts/update_review_dates.py`, `scripts/links.py`,
      `scripts/new_problem.py`, `.claude/hooks/problem_link_reminder.py` wording). Not scaffolded
      when queued (an unattempted problem plants a phantom row, see `scaffolding.md`); scaffolded
