      entry of their own; this one is recorded at the tech lead's request. No `cse.config.yml`
      value changed.
    affects: [release, dashboard, gamification, hooks]

  - id: figure-edges-from-expected-oct08
    date: 2026-10-08
    summary: >-
      ADDS an optional `edges: expected` to a matrix figure (`matrixArg`) in a practice spec. It
      draws only the pairs named in the example case's expected answer, each labeled with the
      matrix entry and in the default colour. Allowed only on a matrix figure and not together with
      `highlight`. Absent, lines are drawn from the input as before. Additive: `schemaVersion`
      stays 1. No `cse.config.yml` value changed.
    affects: [practice]

  - id: row-cap-oct6
    date: 2026-10-06
    summary: >-
      A day has a row cap beside the unit ceiling: `effort_budget.max_rows_per_day`, counting every
      row in a day block except Complexity-technique rows (struck rows count). A day can sit under
      the ceiling and still run to an unworkable number of rows. Units bind the week, not rows: a
      26-week simulation gave identical backlog curves at every cap tried, so the cap fixes a day's
      shape only. Overflow spreads forward; tracker dates are untouched. Enforced by
      `effort_budget.py` (row line and warning) and `check_schedule_integrity.py` (check 5,
      report-only).
    affects: [effort_budget, schedule_integrity, scheduling]

  - id: intake-rate-and-backstop-oct6
    date: 2026-10-06
    summary: >-
      Intake is `effort_budget.intake_per_week` new problems a week, and the next build seats none
      when overdue unproven tracker rows reach `effort_budget.intake_pause_overdue_unproven`.
      Unproven means 🔴, 🟡, or a 🟢 below `effort_budget.carry_forward_min_streak`. The older fixed
      "overdue above N suspends intake" rule is gone: a low pause trigger fires on noise, so the
      trigger sits well above the sustainable band. Each new problem costs about three unproven
      reps (the blank, then a 🟡 loop every `intervals.shaky` days), which is why the rate, not
      the ceiling, decides whether a backlog piles up. Size the rate with
      `scripts/backlog_forecast.py`: a rate whose simulated backlog keeps growing reads piling, one
      that stays flat reads steady. This supersedes the per-day rule that every day with no SD slot
      carries an unseen problem.
    affects: [effort_budget, scheduling, study_guide]

  - id: carry-forward-proven-only-oct6
    date: 2026-10-06
    summary: >-
      A row over the row cap is carried in a schedule section `## ⏭️ Carried to next week (row cap)`,
      never by editing its tracker date. Only proven rows may be carried: 🎓, or 🟢 at a streak of
      `effort_budget.carry_forward_min_streak` or above. Unproven rows (🔴, 🟡, and a 🟢 below that
      streak) are never carried and displace a proven row; the backstop counts them. Easy 🟢 rows
      carry first, from the bottom of the priority order. `check_schedule_integrity.py` check 3
      accepts a due row named in the section only when its tracker row meets that rule.
    affects: [schedule_integrity, scheduling, effort_budget]

  - id: scheduling-skill-oct6
    date: 2026-10-06
    summary: >-
      A `scheduling` skill (`.claude/skills/scheduling/SKILL.md`) owns the ordered weekly build
      procedure, the row cap, the carry rule, the intake rate and the backstop, and the mid-week
      reseat. `weekly-build.md` keeps the trigger, the why and the close-out-commit sentence;
      `effort-budget.md` carries the policy paragraphs; `study_guide.md`'s backlog rule names
      `effort_budget.intake_pause_overdue_unproven`; CLAUDE.md gate 7 cites the skill. Every unit
      number still goes through `effort-units`.
    affects: [scheduling, weekly_build, effort_budget, study_guide, claude_md]

  - id: backlog-forecast-oct6
    date: 2026-10-06
    summary: >-
      `scripts/backlog_forecast.py` is a report-only model of the weekly build: it tallies
      start-to-end outcomes from the archived schedules, simulates the configured rows-per-day cap,
      ceiling and intake across 26 weeks, and reads steady, edge or piling for the configured
      `effort_budget.intake_per_week`. `--check` exits 1 on piling. It is a model of about ten
      seconds, so it is not wired into pre-commit; the weekly build runs it as a step. Its verdict
      thresholds (the steady and piling backlog slopes, the optimistic bracket's 🟢 share for
      classes with no tally data) are tuned numbers and live in `cse.config.yml`
      `backlog_forecast:`, read by the script with no fallback.
    affects: [scheduling, effort_budget, scripts, backlog_forecast]

  - id: contract-schema-gate-exit2-oct7
    date: 2026-10-07
    summary: >-
      `contract_schema.py` exits 2 (blocking) when jsonschema or referencing cannot be imported,
      instead of a string SystemExit (exit 1) that every pre-commit block read as report-only drift,
      so the schema gate could never fire on a machine without jsonschema. `requirements.txt` pins
      `jsonschema>=4.18` (needed for `referencing`). The pre-commit gamify block stages
      progress.json, progress-summary.json and schedule-history.json only when gamify exits 0.
      `dashboard/practice.schema.json` declares `types`, `result`, `signature` and
      `decodeSignature`, matching the site's `practice-validation.ts` guard.
    affects: [scripts/contract_schema.py, .githooks/pre-commit, requirements.txt, dashboard/practice.schema.json]

  - id: deferred-day-planned-frozen-oct8
    date: 2026-10-08
    summary: >-
      NARROWS the header clause for a day that has had rows deferred off it. The header keeps
      `built` as its first figure, and a started day (`day <= session date`) gains a pinned planned
      figure: `| ▸ **Wed** · ~3.8 units · planned 6.6 units — label |` (single-source-ok, example
      figures). The pin is written once, before the first row is deferred off the day, as the
      header stood then; it is never changed or removed. Header parsers read the first `~N units`
      as the day's units, and the label still matches after `planned X units —`. Absent pin:
      planned = built. Export: `workload[].planned` = the pin when present, else the header units;
      `built`, `done` and `days[].units` unchanged; no new field; `schemaVersion` stays 1.
      `check_schedule_integrity.py` gains two report-only checks: (7) a row vanished from a started
      day since HEAD; (8) a planned figure removed or lowered, or a started day's header dropped
      with no planned figure. The day then reads "3.8 of 6.6 units done". No `cse.config.yml`
      value changed.
    affects: [effort-budget, scheduling, dashboard]

  - id: scoped-pull-scaffold-oct10
    date: 2026-10-10
    summary: >-
      A learner naming one problem to do now ("doing 332", "I'm doing 332 right now", "doing 332
      from tomorrow") is a scoped start, and when the number is not on the session day's board it
      is a PULL into the live session. Hook: `kickoff_scaffold_reminder.py` gains a scoped-start
      trigger that injects the session date from `scripts/session_date.py`, says a day named with
      "from" is the source of the pull, and says to reseat per effort-units and scaffold the number
      with `new_problem.py` in the same turn. Source: `session_date.py` `resolve_datetime` warns
      when an explicit `--date` contradicts the detected session date during the small hours.
      References: `scaffolding.md` scope section gains the three examples and the pull sentence;
      `effort-units` SKILL.md Moving section says a day has started once the SESSION date reaches
      it; `scheduling` SKILL.md Mid-week says a pull into the live session reseats and scaffolds in
      the same turn. No `cse.config.yml` value changed.
    affects: [scaffolding, scheduling, effort_budget, hooks]

  - id: moves-leave-a-row-oct10
    date: 2026-10-10
    summary: >-
      Every move of a schedule row, whether or not its origin day has started, leaves the row on
      the origin day, unstruck, with the new date in Next, unbilled there. The origin day's header
      pins its plan once (` · planned X units` after `~N units`, X = the header figure just before
      the first row left). The arrow encodes direction: `←` = moved to an earlier day, `→` = moved
      to a later day, on the origin row and the destination copy. Code: `effort_budget.py` defines
      `MOVE_ARROWS` once; `gamify.py`, `remaining.py` and `check_schedule_integrity.py` read it, so
      `←` parses exactly like `→` (deferredTo, unbilled, tag `moved`). Prose: `effort-units`
      SKILL.md Moving section, `scheduling` SKILL.md Mid-week, `review-workflow.md` Schedule
      integrity. No `cse.config.yml` value changed.
    affects: [scheduling, effort_budget, gamify, remaining, schedule-integrity]

  - id: probe-log-difficulty-oct11
    date: 2026-10-11
    summary: >-
      The Probe log in `dsa/probes/README.md` carries a `Difficulty` column (Easy/Medium/Hard,
      filled at logging time from LeetCode). `gamify.py` `parse_probes` reads that cell first,
      found by header name so older layouts still parse, and falls back to the tracker's difficulty
      when the cell is blank. The site's Recognition rows therefore show the same difficulty tag as
      the other problem rows, including clean probes that earn no tracker row.
    affects: [probes, gamify, recognition-panel]

  - id: tracker-hold-oct11
    date: 2026-10-11
    summary: >-
      A learner-requested deferral past the ladder date lives in
      `docs/foundations/dsa/mastery/holds.yml` (row title, `until`, `since`, `why` = a decision
      id), never as a typed tracker date. `update_review_dates.py` sets Next Review = max(ladder
      date, hold `until`); a hold whose date has passed changes nothing, and a hold naming no
      tracker row or with a malformed field fails the run. Before this, a held row read as due on
      its ladder date forever, so every weekly build counted it overdue and unproven and parked a
      `→` row for it.
    affects: [scheduling, update-review-dates, effort-budget, schedule-integrity]

  - id: variant-label-on-board-oct11
    date: 2026-10-11
    summary: >-
      A board line for a problem number with 2+ tracker rows ends with ` · method: <due row's
      parenthetical>` (`remaining.py`, read from the day's schedule row; `links.py <n>` for a bare
      hand-over is unchanged). It narrows the variant strip in `links.resolve_title_url`, which
      had let the learner code the graduated method instead of the due one. A single-row problem
      prints as before. The same day, a retry stub's base name became the problem's entry point
      (the spec's, else the file's bare name), never a variant-suffixed one (`new_problem.py`).
    affects: [remaining, links, new-problem, scaffolding]

  - id: hook-trigger-precision-oct11
    date: 2026-10-11
    summary: >-
      `kickoff_scaffold_reminder.py`'s scoped start requires the number right after a start verb
      (only problem-ish filler between) and ending its clause (end, punctuation, line break, dash,
      or a continuation word); a month-day ("Jun 12") or "<n> next <time noun>" is not a start.
      `rating_gate.py` triggers only on a comfort glyph (🟢🟡🔴🎓) or the word rating/comfort plus
      a proposal cue, and its block message names the matched tokens; a proposal using only the
      bare words clean/shaky/blank no longer blocks (accepted trade-off). The pre-commit showcase
      and Big-O regeneration reads staged content (`--from-index`). A report-only
      `scripts/check_line_endings.py` flags a staged file whose CRLF/LF style differs from HEAD's.
    affects: [hooks, pre-commit, showcase, bigo]

  - id: restore-dates-colliding-helpers-oct12
    date: 2026-10-12
    summary: >-
      `restore_history.py` dates today's colliding helper itself: an undated top-level class/def
      in today's code that a restored attempt also defines (`UF`) is renamed `UF_<stamp>`,
      definition and uses, by NAME token in today's body only; the stash is never touched, so the
      oldest stays the undated canonical one. It also strips the old `# NOTE: suffix any helper
      class` banner, which `new_problem.py` no longer writes. The duplicate-name warning stays as
      the net when it cannot rename (no stamp, unparseable body). Renaming pasted helpers by hand
      was manual effort for nothing.
    affects: [restore-history, new-problem, retry-and-restore]

  - id: pattern-sense-weekly-oct18
    date: 2026-10-18
    summary: >-
      ADDS a weekly Pattern Sense recognition deck, starting the week of `pattern_sense.starts`
      (`pattern_sense.per_week` problems a week, unpriced, no schedule row). Pool: the Gated rows
      of company_demand.md's "Asked by >=N target companies and untracked" table, minus anything
      tracked, planned, filed under dsa/, in the probe log or queue, in the mock log, in an earlier
      deck or its `skipped:` list, in the mock reserve (bigtech top-100, Status untracked, at least
      that many companies), premium, or family unmapped. `scripts/pattern_sense.py propose` picks
      (one per family, least recently shown first); the coach labels family + technique + cue and
      writes a paraphrase into `dashboard/pattern_sense.yml`; `export` writes
      `dashboard/pattern-sense.json` (no slug or title: dashboard/ is public). The site deals it as
      a two-step answer (family, then a technique in it) and shows a `PS1` results code; the
      learner pastes it to the coach, who runs `ingest` and logs misses to recognition_gotchas.md.
      A problem that has been in a deck is never a probe or a mock. The script has no config
      default: a missing `pattern_sense` block is an error.
    affects: [weekly-build, scheduling, probes, mocks, dashboard]

  - id: pattern-sense-github-save-oct18
    date: 2026-10-18
    summary: >-
      The site saves Pattern Sense results through a Cloudflare Worker with GitHub App sign-in,
      written to the repo the deck was loaded from, and only by that repo's owner (user-owned repos
      only). Path: `dashboard/pattern_sense_results/<YYYYMMDD>.json` (the deck week without dashes).
      `scripts/pattern_sense.py ingest --pending` reads them and the SessionStart banner flags a
      waiting file; a pasted `PS1` code still works through `ingest "<code>"`.
    affects: [pattern-sense, dashboard, weekly-build]

  - id: practice-site-reps-oct18
    date: 2026-10-18
    summary: >-
      A rep completed on the site's practice page arrives in `dsa/attempts/<YYYYMMDD>/<n>_<name>.py`
      (first line `# po-attempt: {json}`; complete means a rating and every test passing). The coach
      folds it into the solution file with `scripts/fold_attempt.py` (`--pending` lists the inbox).
      The rating is the learner's own, picked on the site, and is logged as given; the coach does
      not propose one for these reps. This is an exception to "propose + log on their yes/override".
      A top-of-method comment that is missing is logged as a recognition miss in
      `recognition_gotchas.md`. Unfinished saves stay in the inbox. The SessionStart banner flags
      waiting reps. The complexity question is handled by `practice-site-complexity-oct19`.
    affects: [review-workflow, rating, complexity, recognition]

  - id: streak-freezes-oct18
    date: 2026-10-18
    summary: >-
      SUPERSEDES the stateless rest-day allowance in `gamification-progress-platform`. The
      allowance forgave any single missed day, as often as it happened, so a day with no reps could
      still read as an unbroken streak. It is now a spendable, replenishing freeze bank. The bank
      holds at most `gamification.streak_freeze_max` freezes and earns one per
      `gamification.streak_freeze_earn_every` study days, never past the max. Each missed calendar
      day spends one; a gap longer than the bank breaks the run and empties it; a frozen day keeps
      the run going without adding to it, so `current` still counts study days. `compute_streak`
      replays the whole history (the bank starts full), so no seed or cutover date exists. Today is
      not missed until it is over. Data contract: `streak.restDayAllowance` is removed; added
      `freezes` (bank right after `lastStudyDay`, which the SessionStart hook uses for liveness),
      `freezesLeft` (bank as of generation day), `freezeMax` and `frozenDays` (ISO dates a freeze
      bridged, trailing ones included). `cse.config.yml` key `streak_rest_day_allowance` is replaced
      by the two keys above. Strands any wording that describes the streak as a rest-day allowance
      or reads `restDayAllowance`. The schema keeps the four freeze fields optional
      (`streak.required` is `current`, `longest`, `studyDays`) so the site can still read
      repos that emit `restDayAllowance` and no freeze fields. See references/motivation.md.
    affects: [gamification]

  - id: practice-contract-ext-oct19
    date: 2026-10-19
    summary: >-
      EXTENDS the practice-spec contract (`dashboard-contract-exporters-oct6`) with six additions
      and one checker fix. (E1) Arg codec `list-node-list`: a JSON array of arrays, each built as
      `list-node` builds it; rejected as a result codec. (E2) Result codec `list-node-ref`: the
      returned node becomes the 0-based index of that node (identity) among the nodes reachable
      from the case's first `list-node` / `list-node-cycle` arg, walked with a seen set; `None`
      becomes null; a node outside that walk is a codec error, not a wrong answer. Rejected as an
      arg codec; a spec using it needs a `list-node` or `list-node-cycle` arg. (E3) Per-case
      `judge: {isBadVersion: <int>}`: before the call the runner binds that global name in the
      namespace the solution runs in, from the registry `JUDGE_APIS = {"isBadVersion": lambda bad:
      (lambda v: v >= bad)}`, kept verbatim in `scripts/check_practice_spec.py` and the site's
      `python-driver.ts` (the exporter keeps only the names); a case without `judge` sees no
      binding left by an earlier case. The exporter rejects an unknown name, a non-mapping `judge`
      and a non-int value; `judge` is not an argument, so the arg count stays the signature's.
      (E4) `expected: {anyOf: [...]}`: a mapping whose ONLY key is `anyOf`, holding a non-empty
      list, matches when any one alternative matches under the problem's compare mode; in an ops
      case an element of the expected list may be such a mapping and outputs compare element by
      element. The exporter rejects an `anyOf` mapping with another key and an empty or non-list
      `anyOf`. (E5) An ops spec honours `types.args` for the constructor only (method args stay
      raw); the exporter requires its length to equal the constructor's parameter count. (E6) FIX:
      the checker's round-trip case encodes args with `types.args` and decodes the result with
      `types.result`, as the site's driver does (it ignored `types`, so a tree codec could not be
      verified locally). (E7) Compare mode `unordered-inner`: each inner list is compared as a
      multiset but the outer order stays fixed, because `unordered-nested` also sorts the outer
      list, so a swapped `[critical, pseudoCritical]` pair would pass it. Files:
      `scripts/export_practice.py`, `scripts/check_practice_spec.py`,
      `dashboard/practice.schema.json` (+ tests), `spec.md`, and the site's driver, model,
      validation, compare and results format. `schemaVersion` stays 1. Deploy order: the site
      first, then the specs that use these. No `cse.config.yml` value changed.
    affects: [practice]

  - id: practice-site-complexity-oct19
    date: 2026-10-19
    summary: >-
      SUPERSEDES the "queued, not asked now" handling of the complexity gate in
      `practice-site-reps-oct18`. The site's complete-rep dialog asks time and space, each with a
      why, before the rating. The labels come from the pool in big-o.json (`pool`, emitted from
      `scripts/export_bigo.py` COMPLEXITY_POOL) and are judged against `dashboard/bigo.yml` through
      big-o.json. The attempt header carries them as `complexity: {time, space, whyTime,
      whySpace}`, required on a complete save. `scripts/fold_attempt.py` compares them to the
      bigo.yml reference by exact string equality and prints the verdict: a match satisfies the gate
      and queues nothing; a mismatch or a problem with no reference bound is queued in
      `complexity_gotchas.md`, and the Sunday complexity block takes those only. `schemaVersion` of
      big-o.json stays 1.
    affects: [review-workflow, complexity, practice]

  - id: rating-ignores-complexity
    date: 2026-09-23
    summary: >-
      The comfort rating no longer considers complexity AT ALL. The complexity gate itself is
      unchanged: the coach still asks the learner for time AND space, each with an itemized
      why-clause, before every rating (`rating_gate.py` unchanged). What changes is the
      consequence: a wrong, prompted or taught Big-O bound never lowers or caps the rating, on any
      rep. Rating is judged on recognition + code only. Every complexity miss is still corrected,
      carded in `complexity_gotchas.md`, and queued into the end-of-week complexity cleanup, which
      re-asks it cold on the existing code; only the rating consequence is gone. SUPERSEDES the
      clean-code-only scope of `complexity-cleanup-formalized`: that waiver applied only when
      recognition AND code were clean off a blank page, and its scope sentence ("if the code
      needed a real fix, the normal freebie-to-yellow cap stands") is now wrong. A real CODE fix
      still affects the rating through the code criterion; the complexity miss itself never does,
      whether or not the code also needed a fix. Retires the freebie / repeat-yellow cap in
      `complexity_gotchas.md` as a rating mechanism (the ledger stays, now tracking category
      transfer only). No `cse.config.yml` value changed. Strands: "correct complexity" as a green
      criterion; a complexity miss capping a rating; "clean code + Big-O miss" as the waiver's
      scope (now every rep). See CLAUDE.md gate 1, `SKILL.md` section 2/3, `review-workflow.md`
      step 1, `spaced-repetition.md`, `weekly-build.md`, `complexity_gotchas.md`,
      `.claude/memory/feedback_ask_complexity.md`.
    supersedes: [complexity-cleanup-formalized]
    affects: [complexity_gate, ratings, complexity_gotchas, feedback_ask_complexity, weekly_closeout]

  - id: complexity-reask-unpriced
    date: 2026-09-28
    summary: >-
      A complexity re-ask row (Technique `Complexity`) prices 0 units. The weekly build already
      left these rows out of a day's header, but `effort_budget.py` priced each one as a full rep
      of its problem, so the workload chart's done and built ran above the plan.
    affects: [effort_budget]

  - id: daily-goal-is-the-ceiling-sep28
    date: 2026-09-28
    summary: >-
      The ceiling changes from a cap to build under into the daily goal. Each day is built as
      close to it as possible, and a small overshoot is fine. The value itself is unchanged in
      `cse.config.yml` (`effort_budget.ceiling`); only how a build uses it changes. See
      `references/effort-budget.md`, "The ceiling is the daily goal".
    affects: [effort_budget, scheduling]

  - id: problem-link-order-sep27
    date: 2026-09-27
    summary: >-
      ADDS a link-order rule for a LeetCode problem, applied to PLANNED problems and future
      scaffolds only (a tracked problem or an existing solution file is never relinked). In
      order: (1) LeetCode, when the problem is free there. (2) NeetCode, when LeetCode paywalls it
      AND NeetCode's own public list has it. (3) A premium catalog the learner subscribes to, when
      neither of the above has it and that catalog does. (4) Another judge carrying the same
      problem (Kattis, CSES and similar), found by hand and passed as `--url`; the scaffold says
      so when it cannot confirm the link is free. (5) LeetCode's own page, stated as paywalled
      rather than hidden. Every step is CHECKED against that site's own list, never guessed.
      JOIN METHOD for a catalog whose slugs differ from LeetCode's: the map is joined on the
      LeetCode slug each catalog page links, never on the title and never on the catalog's own
      slug; a page with exactly one LeetCode link is a problem page, zero is a lesson page, more
      than one is ambiguous and skipped, and a lesson page that happens to link a single
      LeetCode problem as its example is excluded by comparing the path's last segment with the
      slug. IMPLEMENTATION: `scripts/new_problem.py` holds `load_neetcode_slugs()` (fail-soft, but
      an unreadable list is UNKNOWN, never an empty set) and a single `resolve_premium_link(slug,
      neetcode_slugs, hi_map) -> PremiumLink` (`url`, `judge`, `reason`), so the printed NOTE and
      the URL it names cannot disagree; `verify_links()` checks NeetCode's own list and the
      NeetCode-side slug (`NEETCODE_RENAMES.values()`). `scripts/links.py` labels each link by
      judge host. Steps 4 and 5 are superseded by `problem-link-order-oct04`. No
      `cse.config.yml` value changed.
    affects: [links, scaffolding]

