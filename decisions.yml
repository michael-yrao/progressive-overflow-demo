    affects: [scaffolding, practice]

  - id: showcase-contract
    date: 2026-09-22
    summary: >-
      The site's algorithm visualizers stop storing a hand-pasted copy of the learner's Python:
      the site carries no solution code of its own. The repo instead emits
      `dashboard/showcase.json` (schema `dashboard/showcase.schema.json`) from a hand-curated
      manifest `dashboard/showcase.yml`, one entry per (lcNumber, variant), picking a specific
      attempt / method by symbol name (every attempt lives in ONE file as a dated method inside
      `class Solution:`, or a dated class for a design problem, so "pick a version" means picking
      a method / class by name, not a commit). `scripts/export_showcase.py` reads the manifest and
      the live solution files and emits a byte-identical (EOL-normalized), line-numbered slice per
      entry: `container` (the `class Solution:` header), `attempt` (the picked def / class, its
      leading comment banner folded in), and any `helper` segments, so the site renders code
      provably identical to the repo and links to the real line range. Unlike `gamify.py`,
      `export_showcase.py` is deliberately NOT fail-soft: an unresolvable manifest entry (unknown
      symbol, a twin problem number missing its required `file:`, a container mismatch, a stale
      committed `showcase.json`) is a hard failure (`--check` exits 1), because a stale or wrong
      showcase contract is exactly the drift this tool exists to remove. Renaming or deleting a
      manifest-selected symbol is a BREAKING CHANGE, surfaced by `--check` (wired into
      `.githooks/pre-commit`, report-only). `progress.json` stays code-free; `showcase.json` is the
      one contract that deliberately carries verbatim, curated source. `links.py`
      `resolve_title_url(number, path)` (header-over-tracker) is the single implementation of
      that precedence. No `cse.config.yml` value changed. See `dashboard/showcase.yml`,
      `scripts/export_showcase.py`, `dashboard/showcase.schema.json`; promoted into the engine by
      `dashboard-contract-exporters-oct6`.
    affects: [gamification]

  - id: bigo-contract
    date: 2026-09-24
    summary: >-
      ADDS the site's Big-O Trainer as a second grounded-code contract, mirroring
      `showcase-contract`: a hand-curated manifest `dashboard/bigo.yml` ->
      `scripts/export_bigo.py` -> `dashboard/big-o.json`, rendered by the site as a picker
      (All / Easy / Medium / Hard plus a "my complexity misses" toggle) dealing a capped run from
      the learner's own solution files. PICK RULE: each entry resolves to the latest DATED
      attempt in its file (by the symbol's `_YYYYMMDD` suffix or its banner comment); a tie is
      broken by the symbol LOWEST IN THE FILE; a file with no dated attempt requires an explicit
      `symbol:` in the manifest, a hard error otherwise. LABELS: one ordered canonical pool
      (`export_bigo.COMPLEXITY_POOL`) replaces inconsistent spellings; the site checks answers by
      EXACT STRING EQUALITY against the pool, and each question's 4 options are seeded
      deterministically (`random.Random(f"{key}|{axis}|{correct}")`), confusable distractors
      first, topped up from nearby pool labels, so the same entry always offers the same
      distractors. `isMiss` is read from `docs/foundations/dsa/mastery/complexity_gotchas.md`'s
      cleanup-queue and ledger tables (`parse_miss_numbers`); `difficulty` is joined from the
      tracker via `effort_budget.parse_rows()`. A manifest entry whose bound is `TODO` is SKIPPED
      with a warning, never emitted; filling `TODO` bounds is an ordinary rep for the learner,
      never delegated. Hook wiring is REPORT-ONLY, as for `showcase-contract`. No
      `cse.config.yml` value changed. See `dashboard/bigo.yml`, `scripts/export_bigo.py`,
      `dashboard/big-o.schema.json`; promoted into the engine by
      `dashboard-contract-exporters-oct6`.
    affects: [gamification]

  - id: practice-site-fold-action-oct19
    date: 2026-10-19
    summary: >-
      The fold of a site-completed rep moves from coach-applied to a GitHub Action.
      `.github/workflows/fold-attempts.yml` runs on every push to `dsa/attempts/**` and calls
      `python scripts/fold_attempt.py --apply --all`, commits through the repo's pre-commit hook,
      pushes, then calls `notify-site.yml` through `workflow_call` (a push made with GITHUB_TOKEN
      triggers no other workflow). The fold writes the tracker row, the schedule strike / pull-in /
      late-completion placement, the next review when it falls in the same week, the complexity
      queue row and the recognition-miss entry. Stays manual: retirement 🎓 to 🏆 (the job summary
      names a candidate), a failed job (a blocking check exits 2 and nothing is pushed; fold by hand
      with `--apply <path>` after fixing), and an attempt the fold refuses (it stays in the inbox).
      "Today" is the inbox folder date, with `TZ` set in the job from the config's `timezone`
      (`.github/actions/engine-setup`). No config value changed.
    affects: [review-workflow, practice]

  - id: headless-study-track-oct19
    date: 2026-10-19
    summary: >-
      ADDS the headless study track: a learner works on the site with no clone, and every engine
      step runs as a GitHub Action in the learner's own repo. The principle: every site action is
      a small commit, and every engine step is an Action running the same Python through the
      pre-commit hook, so a site rep and a chat rep land the same files. Three Actions:
      `onboard` (the site writes `intake.yml`; `scripts/bootstrap.py --intake` writes the config,
      the roadmap and week 1, then `intake.yml` is removed), `fold-attempts` (a site attempt
      becomes a tracker row, a schedule strike and the follow-up queue rows) and `weekly-build`
      (`scripts/build_week.py`). THREE FOLD FIXES: one attempt is one transaction (a refused
      attempt is restored and the others still fold); a missing solution file is scaffolded at fold time;
      the first rep of a problem keeps the rating the learner picked. NEW CONFIG KEYS:
      `timezone` and the `automation:` block (`weekly_build`, `build_lead_hours`,
      `practice_index_url`, `prefer_practice_spec`); onboarding writes `weekly_build: true`.
      `daily_cap` stays legacy and is no longer asked. WHAT HEADLESS DROPS: forecast talk, the
      complexity block, the Pattern Sense deck, the `technique_comfort_audit` pull order,
      primers, probes and mocks, spec authoring (the build prefers problems the site can run
      instead), the next-week preview, prose goals and day labels, and the SD slot.
      `write_week1` is deleted; week 1 comes from `build_week.py` in every mode.
    affects: [onboarding, scheduling, release, weekly_build]

  - id: ci-gates-oct20
    date: 2026-10-20
    summary: >-
      ADDS a CI test gate, `.github/workflows/ci.yml`: pytest over `scripts`, `tests` and the hook
      tests (explicit paths, because pytest skips dot-directories), then the checks that pass on an
      empty template. Exit policy is the pre-commit hook's own: the cheat-sheet check fails on any
      non-zero; each exporter check fails the job on exit 2 and emits a warning on exit 1. LEFT OUT:
      `technique_coverage.py --check`, which exits 1 on the clean template (its generated report
      is stale). The gate runs only on the template (`is_template`, the inverse of the engine
      workflows' guard), so a generated learner repo copies the file and never runs it. PINS every
      external action by commit SHA with a `# vX.Y.Z` comment: learner repos inherit these
      workflows with `contents: write`, so a moved tag would run in every learner repo.
      `tests/test_workflows_pinned.py` enforces it. NO `dependabot.yml` in the template: a
      generated repo would copy it, and Dependabot PRs would make its workflow files diverge from
      the template, which the engine-update path then reports as conflicts; template pins arrive
      by promotion from cse-progress.
    affects: [release, onboarding]

  - id: headless-gaps-oct20
    date: 2026-10-20
    summary: >-
      ADDS three fixes to the headless track. (1) `build_week.py --top-up`: once the target week's
      file exists, the normal build skipped and never re-seated a due tracker row with no cell
      in it (a row left undone, a follow-up created after an early build). Top-up seats such rows,
      through the same `plan_week`/`seat()` path, into the newest live week on days from today on,
      skips a row struck in the previous week's file, never archives or moves a file, and honours
      `automation.weekly_build`. `weekly-build.yml` runs the normal build and then `--top-up` on
      every trigger; a top-up that seated rows commits as `top up week of <date>`. (2) NEW CONFIG
      KEY `automation.bigo_reference_url` (optional, not in the build's required keys): when
      `bigo.yml` has no entry for a folded problem, `fold_attempt.py` reads the published Big-O
      reference once per run; any network, JSON or schema failure leaves today's "no reference
      bound; verify cold" queue row, and an absent key fetches nothing. (3) `gamify.py` prints one
      aggregated line for declared problems with no Waiting Room row or roadmap entry instead of
      one per number, and prints it (and the roadmap-unreadable line) only when the tracker has
      dated rows, so a fresh checkout validates quietly.
    affects: [weekly_build, site_reps, onboarding]

  - id: site-hold
    date: 2026-10-20
    summary: >-
      A learner can set or release a deferral from the site's board. The Worker writes a
      `why: site-hold` entry to `docs/foundations/dsa/mastery/holds.yml`: `until` is after today
      and at most `MAX_HOLD_DAYS` days out (a Worker contract constant, not a config key);
      `until: null` releases; a hold owned by another `why` is refused with 409
      `hold-owned-by-decision`. Next Review = max(ladder, until) via `apply_holds`, with no
      schedule rewrite: the current week's row keeps its place with a ⏸ mark and the weekly
      build re-seats it. `progress.json` `problems[].heldUntil` (new, optional) carries the hold.
      `.github/workflows/regenerate.yml` replays the pre-commit hook over a push that bypassed it
      (`scripts/replay_hook.py`, marker ref `refs/regenerate/last`). The hook's tracker and
      gamify triggers gain `holds\.yml$`. No config value changed. 2026-10-21: the site's hold UI
      and the Worker route were withdrawn (a Blank rating is the learner's "can't do it" signal;
      the ladder schedules the retry); holds.yml stays a coach-set record and the board shows ⏸
      read-only.
    affects: [dashboard, review-workflow]

  - id: site-coach-session
    date: 2026-10-18
    summary: >-
      The coach on progressiveoverflow.com follows `references/site-session.md`; a message with a
      `<page_context>` block is the site coach. It supersedes the "rating logged as given" exception of
      `practice-site-reps-oct18` for coached reps: a coached site rep takes the recognition and
      complexity gates and propose + confirm, then the coach writes the `dsa/attempts/` file from
      `page_context.code` and runs `scripts/fold_attempt.py --coached <file>`. Uncoached site saves keep the
      `practice-site-reps-oct18` path. Gate 9 (kickoff) does not apply on the site; the coach scaffolds
      just in time, one problem. Scope is studying only. A correction there is logged to
      `self_eval_log.md` with `site: fix pending`, and the intervention-ladder fix waits for VS Code.
    affects: [review-workflow, rating, scaffolding, site-coach]

  - id: release-v0-11-0-oct20
    date: 2026-10-20
    summary: >-
      RELEASES v0.11.0 (VERSION bumped from 0.10.1, `.coach-sync/manifest.json` re-emitted; the
      annotated `v0.11.0` tag is the maintainer's step, per CLAUDE.md "Releasing"). It ports the
      practice repo's Round 2 engine changes, each recorded under its own id and not restated here:
      the CI gate and SHA pins (`ci-gates-oct20`), `--top-up`, the Big-O reference soft-fetch and the
      aggregated warning (`headless-gaps-oct20`), holds and `regenerate.yml` (`site-hold`), and the
      site coach session with its coached fold (`site-coach-session`); the variant-rows join and the
      recognition-pick grading have no id of their own in the practice repo. Also in this release:
      `update_coach.py` sync fixes (the manifest baseline is upstream's hashes, so a
      conflict-protected file survives the next sync; a real sync writes `VERSION`), and
      `notify-site.yml` dispatches to the repository variable `SITE_REPO`, skipping with a notice
      when it or the token is unset. The example config's `dsa_mock.first_due` and
      `pattern_sense.starts` are the token `PLACEHOLDER` and bootstrap fills both in every mode. No
      `cse.config.yml` value changed; one optional key was added (`automation.bigo_reference_url`).
    affects: [release, weekly_build, hooks, onboarding, dashboard]

  - id: release-v0-9-0-oct19
    date: 2026-10-19
    summary: >-
      RELEASES v0.9.0 (VERSION bumped from 0.8.0, `.coach-sync/manifest.json` re-emitted; the
      annotated `v0.9.0` tag is the maintainer's step, per CLAUDE.md "Releasing"). It ports the
      practice repo's changes since v0.8.0, each recorded under its own id and not restated here:
      the three new skills (`effort-units`, `scheduling`, `practice-problem`:
      `scheduling-skill-oct6`), the scheduling scripts (`row-cap-oct6`,
      `intake-rate-and-backstop-oct6`, `carry-forward-proven-only-oct6`, `backlog-forecast-oct6`),
      Pattern Sense (`pattern-sense-weekly-oct18`, `pattern-sense-github-save-oct18`), the
      practice-contract extensions (`practice-contract-ext-oct19`, `practice-site-reps-oct18`,
      `practice-site-complexity-oct19`), the decision-tree cheat sheets and family vocabulary
      (`greedy-family-oct18`, `intervals-split-four-ways-oct6`), and the commit-and-push gate
      (`commit_push_gate.py`: commit and push are two commands). ONBOARDING PATH: a new learner
      can sign in at progressiveoverflow.com/start and choose DSA; the site creates
      `<you>/cse-progress` from this template (collaborators only while this repo is private), so
      the template's starter files are what a first-time learner meets. The starter `dashboard/`
      therefore ships the generated progress, cheat-sheet and manifest JSON, and the exporters
      that need the learner's own data (practice, Big-O, showcase, Pattern Sense) write nothing
      until it exists. No `cse.config.yml` value changed.
    affects: [release, dashboard, practice, scheduling, hooks]

  - id: board-priority-sort-sep29
    date: 2026-09-29
    summary: >-
      CHANGES who orders a day: the priority order (red/yellow reps, then new problems, then
      probes, then green by streak with Easy last, then graduated, then complexity re-asks) was
      applied by hand at the build; `scripts/schedule_priority.py` now sorts each day's rows on
      commit (the pre-commit hook, live weeks only), and `remaining.py` prints the board in that
      order. The kickoff board moves from `links.py` to `remaining.py`. Strands any rule reading
      "build the lineup from links.py" for a day's board.
    affects: [kickoff, lineup, weekly_build]

  - id: technique-catalogue-oct22
    date: 2026-10-22
    summary: >-
      CHANGES where the DSA technique vocabulary lives. The catalogue moves to
      `cse-coach/curriculum/dsa/techniques.yml`, engine-owned and synced by the existing
      `curriculum/**/*.yml` entry of `ENGINE_PATHS`. `docs/foundations/dsa/mastery/techniques.yml`
      stays learner-owned as an OVERLAY holding only the spec keys `queued` / `planned` / `review`,
      variant `queued`, the learner's custom specs (9001-9999) and learner-local techniques.
      `scripts/curriculum.py` `load_techniques(catalogue, overlay)` merges them: catalogue order
      first, overlay learner keys merged into a matching (number, method) spec, unmatched specs
      and variants appended, new names appended last, and other overlay keys on a catalogue name
      ignored. `order` is the catalogue index. Catalogue specs now carry `title` / `url` /
      `difficulty`, the planned-title fallback after the Waiting Room and `roadmap.yml`, so planned
      problems get titles for every learner. `neetcode.yml` moves to `curriculum/dsa/neetcode.yml`.
      cse-progress has no `update_coach.py` of its own and receives exactly the catalogue and
      `neetcode.yml` by running cse-coach's updater scoped:
      `python ../cse-coach/scripts/update_coach.py --root . --only curriculum/dsa/techniques.yml
      --only curriculum/dsa/neetcode.yml`. It is scoped because a full `curriculum/**` sync would
      bring `milestone.yml` into cse-progress and change its intake (`build_week.py`). A scoped
      sync leaves `VERSION` and the other manifest entries alone. A new cse-coach Action
      `demo.yml` rebuilds `michael-yrao/progressive-overflow-demo` on engine and curriculum
      changes (secret `DEMO_DEPLOY_KEY`, an SSH deploy key with write access on the demo repo
      only; template-only guard). cse-coach CI gains a freshness step: `technique_coverage.py
      --check`, then `gamify.py --date` and a `git diff --exit-code` over the starter outputs.
      `totals.solutions` is dropped from gamify and the schema. No `cse.config.yml` value changed.
    affects: [techniques, curriculum, sync, dashboard, demo, ci]
