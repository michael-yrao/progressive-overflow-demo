# Engine decisions — the dated record of when the model CHANGED.
#
# This is the other half of `cse.config.yml`. The config says what the values ARE; this says
# when and why they became that, and it is what rule files reconcile against.
#
# ── Why this file exists ──────────────────────────────────────────────────────────────────
# Rules go stale silently, and not because their vocabulary drifts — because their PREMISE
# expires. `feedback_unseen_on_non_sd_days` was entirely correct given "an SD day costs 3.0
# units against the day". When that stopped being true on Aug 16, 2026, nothing connected the
# two, and the rule kept reading as current for a day until a full manual audit found it.
#
# Two detectors were built first and neither can catch that class:
#   - a retired-VOCABULARY list only catches the spellings it was handed. It had `daily_cap`
#     and not "daily cap", so eight live instances of a superseded rule sat unflagged.
#   - the restated-VALUE check matches the CURRENT config value, so a line asserting a STALE
#     one (`ceiling 9.0`) is structurally invisible to it.
#
# Both failures are failures of WORDS. A date cannot be misspelled, and every rule file
# already has one — so a temporal check starts COMPLETE: nothing can be silently absent.
#
# ── How it works ──────────────────────────────────────────────────────────────────────────
# Each rule file carries `reconciled: YYYY-MM-DD` in its frontmatter. A rule whose
# `reconciled` date predates a decision below has NOT been read against that decision.
# `scripts/reconcile.py` reports those; bumping the date is the explicit act of saying
# "I read this rule against that decision, and it is either still right or now fixed."
#
# ⚠️ `reconciled` is a DELIBERATE field, never `git log -1` on the file. Git mtime measures
# "was edited", not "was re-examined" — a typo fix would have marked the most broken file in
# the repo as current. That distinction is the whole reason this is not automated.
#
# ⚠️ This does not remove the audit work. It makes it VISIBLE and TRACKED instead of
# invisible, which was the actual failure: nobody knew the backlog existed.
#
# ── What belongs here ─────────────────────────────────────────────────────────────────────
# Decisions that can STRAND A RULE — a changed value, a retired concept, a moved boundary.
# NOT every new rule: adding one stands on its own and invalidates nothing. If in doubt, ask
# "could a rule written before this still read as correct while now being wrong?"

decisions:
  - id: close-out-commit-authorization
    date: 2026-09-14
    summary: >-
      NARROWS the absolute "ask before every commit AND push, no exceptions" (feedback_commit_discipline,
      set Aug 16 after the 31-commit run). The learner granted a scoped exception: an EXPLICIT
      close-out-and-publish instruction — "close out the day/session/week", "wrap up and commit/push" —
      IS standing authorization to commit AND push with no per-action confirmation; the agent does the
      pre-commit sweep (git status · restore_history.py · update_review_dates) and reports what landed.
      Why it does not reopen the 31-commit hole: that failure was AGENT JUDGEMENT (inferring a "natural
      breakpoint"); this trigger is the LEARNER'S EXPLICIT PHRASE, which is not agent discretion — the
      same premise-expired reversal as advance-prompt-tail. Carve-outs still force an ask: an unrated rep,
      an unsettled schedule/structural decision, a weekly close-out whose build isn't done (gate 7 first),
      an odd git state, or any irreversible action beyond an ordinary commit+push (delete, force-push,
      history rewrite). A vague close-out ("call it a night") still only reports done. Normative sentence
      moved into CLAUDE.md gate 8. Also: kickoff_scaffold_reminder.py now excludes this phrase family, so
      "close monday session" no longer false-fires the kickoff gate (verified). No cse.config.yml value
      changed. Strands any rule still reading "a close-out is never permission." See self_eval_log 2026-09-14.
    affects: [commit_discipline, kickoff, weekly_build]

  - id: probe-local-file-link
    date: 2026-09-14
    summary: >-
      CORRECTS the prior "a recognition probe stays UNLINKED (a link spoils it)" wording. Only the
      LC/NC (problem-page) link spoils — its topic tags/editorial name the technique, which is the one
      thing the probe measures. The LOCAL file link does NOT: the dsa/probes/<n>_<snake>.py path names
      the problem, not the technique, and the learner must open the file to do the rep. New rule: a probe
      carries its LOCAL file link ONLY, never LC/NC — the inverse of the normal [file]·[LC] pair.
      Enforced at the source: new_problem.py grew a --probe mode (writes the blind file to dsa/probes/,
      outside solutions.roots so no tracker row, and prints the local link only); scaffold_links_reminder.py
      gained a probe branch (asks for the local link only, not "both"); problem_link_reminder.py's Stop
      message updated. Cause: the over-strict "unlinked" rule left the learner asking for the probe's file
      link 3× on Sep 14. No cse.config.yml value changed. Strands the "probe stays unlinked" wording in any
      rule file predating this. See self_eval_log 2026-09-14, dsa/probes/README.md.
    affects: [scaffolding, lineup_links]

  - id: kickoff-scaffold-gate
    date: 2026-09-13
    summary: >-
      The "a real kickoff scaffolds the whole day's board before presenting it" rule was PROMOTED
      out of the reference tier (references/scaffolding.md, an opt-in read) to hook + always-on gate.
      Cause: the multi-skill migration moved it off always-injected CLAUDE.md into scaffolding.md,
      whose open-trigger presumes the decision to scaffold, so a session-start greeting never reached
      it — presented-not-scaffolded on Sep 12 ("start saturday session") and again Sep 13 ("let's do
      our sunday session"); the Sep 12 note-in-the-same-cold-tier fix lapsed in a day. Now enforced by
      a UserPromptSubmit hook (kickoff_scaffold_reminder.py, warn-only, regex-matches kickoff phrasing)
      AND stated as gate 9 in CLAUDE.md + gate 7 in session_start_memory.py's ALWAYS_ON block.
      scaffolding.md keeps the mechanics + scope nuance but is no longer the sole home of the trigger.
      No cse.config.yml value changed. See self_eval_log.md 2026-09-13.
    affects: [scaffolding, scheduling, weekly_build]

  - id: ai-pillar-revived-deferred
    date: 2026-09-12
    summary: >-
      REVISITS `ai-track-removed` (Aug 13): AI Engineering returns as a planned THIRD pillar, but
      PARKED behind a measured trigger — not started now. Learner's calls this session: (1) DEFER
      until DSA lightens (Backtracking opened Sep 14, DP runs Oct–Nov — the heaviest phase — and the
      SD pillar already fills the starved "evening" slot, so there is no additive capacity now);
      (2) GOAL = interview prep, so the path front-loads evals (02/04) → RAG (03) → agents (05) →
      ml-system-design (10), NOT linear 00→12; (3) start at ~1 notebook/week on activation, with an
      explicit cadence RAMP for BOTH AI and SD as DSA load drops. Design mirrors the SD pillar
      (off-board, UNPRICED, cadence-driven, learner-does/coach-assesses, own tracker). The recorded
      cause of the original removal — "a plan nobody executed" — is defended against three ways:
      every AI rep is an ACTIVE scored+spaced artifact (run the notebook + a modification/eval the
      coach probes cold, reusing the SD drills), not a reading checkbox; the activation trigger has a
      real firing mechanism (a weekly-build checklist step, not a paragraph); and the path is a
      prioritized subset, not a 40-notebook march. Trigger (measured, not a date): DP/Backtracking
      phases closed AND effort_budget.py shows ≥2 days/week well under the ceiling for 2 consecutive
      weeks. Resource: github.com/calmrocks/ai-engineer-notebooks (public — tracker lives in-repo under
      docs/foundations/ai_engineering/, no private-SD-study-repo-style privacy split). NOT built yet (single-
      source / no-premature-scaffold): the skill reference, the ai_progress tracker, and any
      cse.config.yml cadence key — added at activation when they hold live values. Spec parked in
      docs/foundations/ai_engineering/ROADMAP.md + project_ai_pillar.md.
    supersedes: [ai-track-removed]
    affects: [tracks, system_design, scheduling, weekly_build]

  - id: no-summary-layer-advance-tail-hook
    date: 2026-09-12
    summary: >-
      Considered adding an in-session context-truncation / summary layer to guard against
      within-session degradation (a rule stated early in a session lapsing later — lost-in-the-middle).
      DECLINED. The harness already auto-compacts; a bespoke summary fights the tiered design
      (docs/ARCHITECTURE.md) and degrades the very coaching nuance it would try to preserve; and LITM
      is cured by keeping hot context SMALL + re-injecting load-bearing rules POSITION-INDEPENDENTLY
      (hooks), not by compressing the middle. The repo's own 2026-08-02 meta-review already measured
      this: memory-paragraph rules recurred 7/9, source fixes held 4/4, hooks held. A within-session
      lapse is just the coldest case — a rule living only in hot chat. So the within-session defense
      is the existing Stop hooks, which re-fire EVERY turn regardless of conversation position. One
      fragile-but-mechanizable root was promoted off the prose rung accordingly: the ADVANCE-PROMPT
      TAIL ("Code it.", "ready for the next one?", "on to 271"), which recurred 4+× as prose
      (`pace-flat-discipline` / feedback_let_learner_pace) → now a Stop-hook detector
      `advance_prompt_tail()` added to problem_link_reminder.py (already wired on Stop, no settings
      change). It inspects only the turn's FINAL short sentence, so the required complexity/recognition
      gate prompts and genuine rep questions stay clean; 14 self-test cases pass. This adds an
      enforcement tier to an existing rule; it strands no rule and changes no tuned value.
    affects: [let_learner_pace, turn_economy, hooks, operating_principles]

  - id: self-eval-loop-fires-and-routes
    date: 2026-09-10
    summary: >-
      The self-evaluation meta-review now FIRES (it was an unfired paragraph, 40 days overdue):
      session_start_memory.py computes days-since-last-meta-review + an open count of entries dated AFTER
      that review, and injects a "META-REVIEW OVERDUE" banner past thresholds in cse.config.yml
      (self_eval.meta_review_days / .open_threshold). The intervention ladder's "numbered step" rung now
      routes by trigger: a coaching-moment rule → a skill reference (loads at that moment), an unprompted one
      → CLAUDE.md; the meta-review's promotion step is an EDIT to that layer, not another memory note.
      Also folded ~6 operational orphans that were memory-only into their skill references (SD drills
      quantify_qualify/hld_altitude/coverage_gap_ledger/expand_acronyms → system-design.md; explanation_register
      → SKILL §1; recommend_by_number → scaffolding; dsa_before_sd → weekly-build), leaving each memory file as
      the why. Follows the memory de-convolution (73→51 files) done the same day.
    affects: [self_evaluation, operating_principles, system_design, teaching, scaffolding, weekly_build, reconcile]

  - id: skill-layer-in-intervention-ladder
    date: 2026-09-10
    summary: >-
      The coaching engine moved out of the always-injected CLAUDE.md into a repo-local skill
      (.claude/skills/cse-coach/SKILL.md + references/), loaded only at coaching moments; CLAUDE.md
      dropped 899→168 lines / 70KB→~10KB and now carries only always-on gates, the register rules,
      single-source, decisions/reconcile, the token-discipline cap, and pointers. The intervention
      ladder's "numbered step" rung is now split by trigger: a COACHING-MOMENT rule goes in a skill
      reference (loads reliably at that moment); a CROSS-CUTTING / unprompted rule stays in CLAUDE.md
      (injected every turn). Skill files carry `reconciled:` (SKILL.md in frontmatter, references in an
      HTML comment) and are in reconcile.py RULE_GLOBS + check_single_source.py PROSE_GLOBS, so a future
      decision flags a stale reference and a restated tuned value is caught there too. The self-evaluation
      LOOP itself stays where it was (SessionStart hook gates 2/3 + feedback_self_evaluation.md) — it is
      not a coaching moment; only its distilled lessons live as dated warnings inside the references.
      Not an upstream sync: cse-progress had drifted ahead of canonical cse-coach and uses different
      paths, so the skill was authored from this repo's own current CLAUDE.md.
    affects: [operating_principles, self_evaluation, single_source, reconcile, scaffolding, review_workflow, effort_budget, weekly_build, technique_coverage, system_design]

  - id: complexity-probe-drill
    date: 2026-09-06
    summary: >-
      NEW standing drill (pinned Sep 2, decided Sep 6): the cold complexity probe. The coach fires an
      already-solved 🟢/🎓 problem during a warmup; the learner states time + space COLD on the existing
      code, with the why — no re-solving, no new file. Cadence ~2 per warmup-week, woven into warmups
      (rides free like the recognition gate). Disposable: only a MISS is carded (in the new probe ledger
      in complexity_gotchas.md) and re-queued; a repeated same-category miss escalates to a teach.
      Distinct from the end-of-week clean-code cleanup queue (that re-asks a bound missed on a clean-code
      rep THIS week; the probe fires cold on any mature problem to keep the miss-cluster categories fresh).
      Learner picked "2/warmup-week, ledger-tracked" over a weekly batch of 5. Mechanism lives in
      complexity_gotchas.md.
    affects: [complexity_gate, complexity_gotchas, weekly_build]

  - id: grid-bfs-not-thinned
    date: 2026-09-06
    summary: >-
      Considered thinning the Grid BFS cluster (200, 130, 417, 733) after the learner read it as
      over-tested (417 greened to s2 Sep 6). DECLINED — leave it. The cluster is already nearly free:
      733 is 🎓, 200/130 are s2, the whole cluster generates ~0.17 reps/week, so thinning saves almost
      nothing. "Over-tested" is a feeling; the cost is near-zero because the members are mature. 417 (s2)
      graduates itself on its next clean and can retire normally. Fast-tracking 417 to 🎓 was separately
      refused — the coverage gate needs a HARDER same-technique sibling on the normal ladder and none
      exists (all Grid-BFS problems are Medium/Easy).
    affects: [scheduling, ratings]

  - id: greedy-backtracking-overlap
    date: 2026-09-06
    summary: >-
      Greedy sub-track (Intervals + Greedy phase) runs one week long: 45/763/134/846 land Sep 7–13, and
      the last two (1899 Merge Triplets, 678 Valid Parenthesis String) carry into the Sep 14 week as they
      come due. Backtracking OPENS ON SCHEDULE Sep 14 (22 Generate Parentheses first) — it is not delayed
      for two easy greedy carries, since it is Hard/dense and a delay pushes the whole roadmap (incl. DP,
      Oct–Nov) back. So Greedy and Backtracking overlap for the Sep 14 week. Phase dates are advisory
      (feedback_phase_dates_are_advisory) — a normal carry, not a slip.
    affects: [scheduling, curriculum]

  - id: four-sum-retired-redundant-with-3sum
    date: 2026-09-06
    summary: >-
      18. Four Sum retired. Learner solves it with a set instead of the intended
      two-pointer-after-sort form, which collapses it into a re-run of 3Sum's pattern
      plus a wrapper loop rather than a distinct rep — no new recognition or execution
      challenge over 3Sum. Row dropped, not deferred; no trigger to bring it back unless
      a set-based approach becomes the thing worth drilling.
    affects: [dsa_progress, scheduling]

  - id: complexity-cleanup-formalized
    date: 2026-09-03
    summary: >-
      FORMALIZES the provisional complexity-miss-off-rep-drill (Sep 2). The clean-code complexity
      waiver is now a standing rule, not a per-rep override: when recognition AND code were clean off
      a blank page and the ONLY miss was a Big-O bound, the miss does NOT cap the comfort rating (rate
      on the code) — it is instead queued for an END-OF-WEEK COMPLEXITY CLEANUP, where the coach
      re-asks the bound cold on the existing code at the weekly close-out (no re-solving). Clean →
      clear; missed again → escalate to a complexity teach on that category. Scope is exactly clean
      code + Big-O miss; a complexity miss alongside a code fix keeps the normal freebie→🟡 cap.
      Learner: "we do an end of week cleanup for clean code and big O misses only." Rationale: the code
      rep and the complexity concept are different learning units; re-repping clean code to re-test a
      concept is churn. Mechanism: cleanup-queue table in complexity_gotchas.md (rule 4); close-out
      step in CLAUDE.md workflow step 7; why in feedback_ask_complexity. First applied to 743 (space
      heap-O(E) attribution, logged 🟢 🟡→🟢, queued).
    supersedes: [complexity-miss-off-rep-drill]
    affects: [complexity_gate, ratings, complexity_gotchas, feedback_ask_complexity, weekly_closeout]

  - id: familiarity-discounting
    date: 2026-09-03
    summary: >-
      Effort pricing now discounts for demonstrated familiarity, in three composed layers:
      (A) streak-graded green base (🟢 s0 1.0 → s1 0.8 → s2 0.6 → 🎓 0.5), (B) earned
      difficulty demotion (a proven 🟢 s2+/🎓 problem prices one tier easier — a worn Hard
      bills like a Medium), (C) attempt-count decay for CHRONIC 🔴/🟡 only (≥5 attempts,
      −5%/attempt, floored at −30%). Prompted by the learner: a Hard doesn't feel like 3.0
      or 4.5 after many attempts. Guardrails: no ordering inversion, and conversion pressure
      on fresh (<5-attempt) blanks is untouched. New keys in cse.config.yml under
      effort_budget: green_streak_units, difficulty_demotion, attempt_decay. All routed
      through effort_budget.py's single price() function. Library demand fell ~5.4 → 4.5
      units/day at adoption. The ceiling stays 8.0 — this re-prices demand, not quality.
    affects: [effort_budget, scheduling]

  - id: complexity-miss-off-rep-drill
    date: 2026-09-02
    summary: >-
      POLICY SET BY LEARNER (provisional — to be formally DESIGNED at the Sep 7 build, not yet
      wired): a complexity miss no longer caps a comfort rating when recognition AND code were
      clean off a blank page. The recurring miss is a complexity CONCEPT (e.g. string-is-not-O(1),
      bounded-state-space word-vs-bit), not the problem's code — re-repping clean code to re-test
      the concept is churn. The concept is instead drilled OFF-REP via a planned cold "complexity
      probe" (fire code -> learner gives T/S cold, no writing; tracked in complexity_gotchas.md,
      disposable). First applied to 127 (over-learned code, waiver) then generalized on 202 Happy
      Number (space O(1) missed, cued) at the learner's explicit call. ⚠️ SUPERSEDES the
      freebie/repeat 🟡-cap rule from feedback_ask_complexity FOR THE clean-code case ONLY — until
      Sep 7 this is a per-rep learner override recorded in the ledger, NOT yet a rewritten gate.
      The rating gate + freebie rule still stand as written until the build formalizes this.
    affects: [complexity_gate, ratings, complexity_gotchas, feedback_ask_complexity, probes]

  - id: stack-expression-ladder-parked
    date: 2026-08-31
    summary: >-
      224 Basic Calculator is PARKED beside 227, for the same reason: both were authored to
      justify their own base (150), never frequency-pulled. The Stack-expression 2nd problem
      is now 394 Decode String (Google pull, freq 58.3), and both parked rungs re-gate on
      `rated:394`. Applies coverage-sibling-pulled-not-authored to the rungs already in the
      plan, not just to future ones.
    affects: [scheduling, waiting_room, consolidation_reps]

  - id: interval-flavours-declared
    date: 2026-08-28
    summary: >-
      "Intervals (sort + sweep)" now declares five VARIANTS keyed by sort key + answer shape
      (merge-by-start, insert-into-sorted, schedule-by-end, max-concurrent sweep-line,
      two-list intersection), and min_problems moves 3 -> 5. Before this the technique
      declared no variants at all, so the coverage report read "3 (56,57,435)" with the bar
      met and could not surface a breadth gap even in principle. The two uncovered flavours
      are queued on green:435 / green:56 rather than scheduled -- the technique is zero-green
      across all three problems it has.
    affects: [technique_coverage, techniques_vocabulary, intervals]

  - id: sibling-gate-yellow-not-green
    date: 2026-08-23
    summary: >-
      A thin-technique coverage sibling now gates on the standard 🟡+ consolidation gate, NOT on
      `green:base`. Learner: "for the techniques without proper coverage, we can drop the gate on
      another problem being green." The `green:base` hold (224 on green:150, Floyd Fast/Slow on
      green:202) over-tightened: for a thin technique a second problem is another path to the
      technique's FIRST 🟢 and trains transfer that re-repping one problem can't, so gating coverage
      behind the base going green can deadlock a technique stuck at 🟡. ONE guard retained (what
      green:base was a blunt proxy for): a HEAVILY coach-guided 🟡 — near-🔴, multiple coach-supplied
      fixes per the stuck_log — counts as 🔴 for sibling purposes, convert/teach first (§2a: a sibling
      on an unlearned base just double-blanks). Effect: 224/227 (Stack-expr, 150 clean-🟡) and Floyd
      Fast/Slow (Cycle, 202 🟡) unblock; 239 Monotonic Deque (3 coach fixes Aug 22) stays gated.
      Recorded in techniques.yml (Floyd Fast/Slow trigger) and feedback_consolidation_reps.
    affects: [consolidation, coverage, waiting_room, techniques_yml]

  - id: binary-search-two-axes
    date: 2026-08-30
    summary: >-
      Binary-search vocabulary restructured into TWO INDEPENDENT AXES, replacing a taxonomy that
      was asymmetric and hid a gap. AXIS 1 (what you converge on): exact match | min boundary |
      max boundary. AXIS 2 (what you search over): the array | the answer space. A problem is
      listed under one entry per axis it exercises — the schema already allowed this (74 sat in
      two entries before the change). THE DEFECT: `Binary Search (max boundary)` was already
      keyed on the BIAS and already spanned both search spaces (74 array-space, 1552
      answer-space), but the min side was not keyed that way at all — its answer-space half sat
      in `Binary Search on Answer` and its array-space half was never named, diffused through a
      generic seven-problem `Binary Search` bucket that also held the exact-match problems. So
      coverage reported "Binary Search: 7 problems, healthy" and was structurally unable to
      answer "how many min-boundary reps do I have?" — the identical failure the Aug 17
      max-boundary note describes, mirrored onto the other bias. CHANGES: generic `Binary Search`
      split into `Binary Search (exact match)` (704, 33) and `Binary Search (min boundary)` (153,
      2300, 162, 540, 875, 1011); `Binary Search on Answer` KEPT as the second axis rather than
      folded in (learner: "keep as second axis, harder problems typically have more than just one
      axis" — recognizing you must MANUFACTURE the search space is a distinct recognition skill
      from knowing which bias to use once you have one) and gains 1552, which is answer-space with
      the MAX bias and whose absence was what made that axis read as a min-only concern. 875/1011
      are min-boundary practice regardless of searching the answer space — the learner's point,
      and why they are listed on both axes. 540 placed on min boundary at the learner's call
      (first index where pair-start parity breaks — a predicate boundary, never a target compare).
      FOUND when 153 graduated Aug 30 and the learner asked for coverage on both boundaries.
      EFFECT ON THE BOARD: max boundary is the real gap at 1/3 (74 only — 34 and 1552 are queued
      but untracked, so they do not yet count); min boundary reads 6 and healthy, confirming the
      learner's intuition that it is the default form. 34 and 1552 were already seated for the
      Aug 31 week and closing them also takes `on Answer` to 3/3.
    affects: [techniques_yml, coverage, recognition]

  - id: coverage-sibling-pulled-not-authored
    date: 2026-08-29
    summary: >-
      The candidate POPULATION for a coverage sibling is a company frequency pull first
      (`pull_interview.py --technique <t>`); author or hand-pick only if the pull does not yield
      enough coverage. Learner: "let's make sure the population comes from company pulls first and
      then we can reach for others if there is not enough coverage" — clarified as meaning the pool
      that provides a TECHNIQUE's coverage, not intake generally. feedback_consolidation_reps
      specified WHEN a technique needs another problem and was silent on WHERE it comes from, so the
      source defaulted to coach invention. Found via 227 Basic Calculator II: never in NC150, never
      in a pull, entered Aug 11 solely to justify 150 Evaluate RPN after the learner rejected it
      ("it's the base rung under 224/227/772") — a thin problem generating its own sequel. The
      learner independently reached the same verdict two weeks later ("feels like a brain teaser
      than an actual technique check"). COROLLARY, the sharper half: if a rung exists only to
      justify the problem below it, re-examine the RUNG — do not schedule the sequel. This is
      EXEMPT from feedback_expansion_pull_scheduling's post-NC150 gate, which governs filling
      application slots, not sourcing a sibling. Effect: 227 parked (trigger = rated:<pulled
      Stack-expr sibling>, scaffold deleted so discovery mints no phantom row); 224 flagged for
      re-examination rather than seated by default.
    affects: [consolidation, coverage, waiting_room, pull_interview, study_guide]

  - id: fill-capacity-with-weak-coverage
    date: 2026-08-23
    summary: >-
      When built days sit UNDER the daily ceiling, fill toward it with weak-technique work BEFORE
      deferring that work to a later week — priority order: zero-green conversions & their coverage
      siblings > thin-green fills > backlog. Learner: days at 7.0 felt light while zero-green coverage
      sat deferred to the next week. Prefer ADDING a new sibling problem over pulling an existing
      review forward (trains transfer + a fresh 🟢 path, no interval shortening). The ≤2/week
      consolidation cap may be flexed up when the tracker is under-subscribed (headroom) and the extra
      intake targets zero-green/thin techniques — the cap guards an over-subscribed tracker, not an
      under-subscribed one. Recorded in feedback_surplus_triggered_intake.
    affects: [scheduling, effort_budget, consolidation, weekly_build]

  - id: rating-gate-hook
    date: 2026-08-23
    summary: >-
      New Stop hook `.claude/hooks/rating_gate.py`, at the learner's request ("put a clear gate at
      the rating where it requires code completion + time and space complexities given"). It blocks a
      turn that PROPOSES a comfort rating (comfort marker + a proposal cue like "confirm?"/"→ Sep 2")
      when the learner has not stated BOTH time and space complexity in their recent messages. Binds
      the complexity gate to the exact moment it kept failing — the rating proposal — after that gate
      was run backwards twice (15 on Aug 22, 127 on Aug 23: rating proposed with an axis missing).
      Rung-2 fix (hook) above the rung-4 memory note. Checks the LEARNER's transcript, not a
      self-asserted checklist (ungameable). Detection is keyword-based per axis (no Big-O-count credit,
      which misfires when both O()s are one axis — the 127 case); accepted conservative cost is a single
      block on an axis stated only as a bare O() with no word, which the re-send clears (stop_hook_active).
      Does NOT check correctness of the bound or the freebie ledger — those stay judgement. Wired into
      settings.json Stop alongside problem_link_reminder. See feedback_ask_complexity (ledger-read-before-rating).
    affects: [complexity_gate, rating, hooks]

  - id: link-orphan-reemit-fix
    date: 2026-08-23
    summary: >-
      Two changes to stop a hook-forced link re-emit from reading as a directive (learner: "are you
      linking 901 because you want me to do it first?"). (1) Behavioral, the real fix: in prose, refer
      to a problem by name/role, never a loose number — a number appears only inside its [file]·[LC]
      pair — so the Stop link hook never fires mid-turn and no context-free orphan is created. (2) Hook
      backup: problem_link_reminder.py's block message now permits the fixed tag "(links owed, order
      unchanged)" on a forced re-emit so a debt-payment can't be misread as a pick. Recorded in
      feedback_kickoff_table_links.
    affects: [links, hooks]

  - id: technique-comfort-audit
    date: 2026-08-22
    summary: >-
      New weekly artifact `mastery/technique_comfort_audit.md` and generator
      `scripts/technique_comfort_audit.py`, at the learner's request. A technique-keyed
      PROGRESSION view (distinct from technique_coverage.md, which is gap-keyed): per-technique
      comfort = demonstrated ceiling, auto-rolled from the tracker by reusing the coverage join;
      coverage counts temper it; WHY-lines are hand-authored and PRESERVED across regens; and a
      FUTURE section lists roadmap algorithms not yet started (⚪) with a why, preserved verbatim
      between markers. Refreshed at the weekly build (step 7), NOT the pre-commit hook — it is a
      weekly artifact and per-commit churn would fight the preserved narrative. Adds nothing to the
      engine's computed values; it is a reporting surface only, so no rule written before it can go
      stale because of it. Carries a generated "Needs work" callout at the top (zero-green weakest-first,
      then thin-green) that is the weekly build's PULL-ORDER source, with the priority ruling:
      🔴/🟡 conversions > overdue 🟢 cleans > thin-green fills + probes — a zero-green technique outranks
      discretionary work and fresh cleans, but NOT a clean aged far past its interval (that is a
      retention risk that makes new demand and must still be serviced).
    affects: [weekly_build, technique_coverage, reporting, effort_budget]

  - id: recognition-block-removed-from-scaffold
    date: 2026-08-22
    summary: >-
      The RECOGNITION block is no longer written into scaffolds. new_problem.py's
      recognition_block() is disabled (returns []) and the template's {recognition} line is
      removed, so fresh attempts go straight from the Attempt banner to the def. Completes
      recognition-call-is-the-top-comment (Aug 21), which had already made the block optional
      after the learner declined it as a format twice; on Aug 22 they asked to remove it
      outright ("I always write underneath"). The gate itself is UNCHANGED — the learner's
      top-of-method comment is still the pre-code call, and the coach still fires it verbally
      with SHAPE CUES ONLY, never candidate techniques (the 239 leak). Anti-spoiler protection
      now rests on that habit plus coach discipline, not on a printed prompt. Supersedes the
      MEANS of recognition-gate-in-scaffold (Aug 20); its END (contentless prompting) stands.
    affects: [recognition_gate, scaffolding, no_spoilers]

  - id: two-registers-latitude-vs-stringency
    date: 2026-08-21
    summary: >-
      Rules are now SCOPED to a register instead of reading as universal. DELIBERATIVE work (thinking,
      planning, researching, teaching, interviewing) is unbounded in content — only the packaging rules
      (turn economy, register, pacing, no-spoilers, answer-length) bind. MECHANICAL work (implementing,
      bookkeeping, pulling a stated detail) follows every checklist as a hard gate. The test: would a
      second competent agent produce the same artifact? Yes -> mechanical. Gates (recognition,
      complexity, links, ask-before-commit) are mechanical steps that fire DURING deliberative work, so
      "I was teaching" never excuses a skipped one. Any rule written for a status report must be
      re-read before being applied to an explanation. Options for subagents and hooks were logged and
      held with state triggers — see project_agent_latitude_modes.
    affects: [operating_principles, answer_length, turn_economy, self_evaluation, teaching]

  - id: recognition-call-is-the-top-comment
    date: 2026-08-21
    summary: >-
      The learner's own TOP-of-method comment IS the pre-code recognition call; inline comments are
      mid-code reasoning. The scaffold's RECOGNITION block is an OPTIONAL place to record the call,
      never a required form — do not re-demand it when the top comment already carries the call, and
      do not read a blank block as a missing gate. Narrows recognition-gate-in-scaffold (Aug 20),
      whose block was the MEANS of contentless prompting, not the end: prompting still names shape
      cues only, never candidate techniques. Learner declined the block as a format twice on Aug 21,
      on two machines independently ("doesn't feel conversational enough" / "I always write my
      pre-code comment on top"). Enforcement is trust-based and accepted — no tool can prove a
      comment preceded the code; the honest measure is the label-stripped probe hit rate over ~15
      probes, not per-rep policing.
    affects: [recognition_gate, scaffolding, no_spoilers]

  - id: recognition-gate-in-scaffold
    date: 2026-08-20
    summary: >-
      The recognition gate is written INTO the scaffold by new_problem.py (a RECOGNITION block
      the learner fills before coding), not delivered verbally by the coach. Source fix for a
      spoiler: a verbally-delivered gate can leak the technique by naming candidates (done on 239).
      When the coach does speak first, name only shape cues, never candidate techniques.
    affects: [recognition_gate, scaffolding, no_spoilers]

  - id: pace-flat-discipline
    date: 2026-08-20
    summary: >-
      Coach ends every turn at the answer; the learner drives every transition. No coach-initiated
      "next". Stronger than the prior "no ready? tail" — removes coach-initiated progression
      entirely. Set by the learner after two pacing slips in one session.
    affects: [let_learner_pace, turn_economy]

  - id: midweek-reprice
    date: 2026-08-17
    summary: >-
      The weekly build's "what does not fit" verdict expires as results land. Re-run
      effort_budget.py after logging reps and re-seat from the slip list when headroom opens.
    affects: [scheduling, effort_budget, weekly_build]

  - id: answer-length-cap
    date: 2026-08-17
    summary: >-
      An answer to a QUESTION is capped at one small paragraph and must be scannable
      (bullets/table over dense prose); explaining what you DID is uncapped and unprompted.
    affects: [turn_economy, token_discipline]

  - id: single-source-of-truth
    date: 2026-08-17
    summary: >-
      Every tuned value is stated in cse.config.yml and nowhere else. Prose points, never
      copies. Enforced by scripts/check_single_source.py from the pre-commit hook.
    affects: [intervals, effort_budget, graduate_at_streak]

  - id: probe-difficulty-by-technique
    date: 2026-08-17
    summary: >-
      Recognition probes pick the TECHNIQUE first, then the easiest unseen problem that
      forces it; per-technique ratchet Easy -> Medium; capped at Medium. Easy-only could not
      reach most banked techniques.
    affects: [recognition_probes, effort_budget]

  - id: ask-before-commit
    date: 2026-08-16
    summary: >-
      ASK before EVERY commit and EVERY push, no exceptions. Replaced "commit once at session
      end", whose judgement clause was a loophole — 31 commits ran under it in one session.
    supersedes: [batch-commits-at-session-end]
    affects: [git_workflow, session_close]

  - id: sd-unpriced
    date: 2026-08-16
    summary: >-
      SD is off-board and UNPRICED. The ceiling was lowered instead, so the SD evening is
      charged once on every day rather than per SD slot. sd_lane_units/sd_deep_dive_units
      retired; effort_budget.py --sd adds 0.
    supersedes: [sd-lane-price-raised]
    affects: [effort_budget, system_design, scheduling]

  - id: ceiling-lowered
    date: 2026-08-16
    summary: The daily effort ceiling was lowered; it is now the honest DSA-only number.
    affects: [effort_budget, scheduling]

  - id: sd-boundary-is-content
    date: 2026-08-16
    summary: >-
      Only excerpts of a third-party study resource stay private. study_guide.md and the SD
      tracker live in this repo; senior_ramp, framework, coverage_map, mocks, concepts,
      components, technologies, templates live in `<your-sd-study-repo>`.
    supersedes: [sd-track-moved-out]
    affects: [system_design]

  - id: sd-track-moved-out
    date: 2026-08-15
    summary: The System Design track moved to a private SD study repo (`<your-sd-study-repo>`).
    affects: [system_design]

  - id: sd-rebuilt-as-mocks
    date: 2026-08-13
    summary: >-
      The three-lane SD study model is retired — no lanes, no note-building reps, no blind
      sprints, no Bootstrap/Transition/Mastery arc. The learner studies on a resource of their choice;
      the coach runs cold mock interviews and scores them.
    affects: [system_design, scheduling]

  - id: ai-track-removed
    date: 2026-08-13
    summary: The AI System Engineering track was removed. Not deferred; no trigger.
    affects: [tracks]

  - id: sd-lane-price-raised
    date: 2026-08-09
    summary: The SD lane slot went from 2.0 to 3.0 units. (Later retired entirely — see sd-unpriced.)
    affects: [effort_budget]

  - id: effort-budget-replaces-count
    date: 2026-08-07
    summary: >-
      A day is budgeted in UNITS (comfort x difficulty) against a ceiling, not as a problem
      count. daily_cap is superseded.
    supersedes: [daily-cap]
    affects: [effort_budget, scheduling, daily_cap]

  - id: session-dating-source-fix
    date: 2026-08-02
    summary: >-
      Session date is resolved by scripts/session_date.py (dirty tree = live session), not
      datetime.now(). All date-touching scripts take --date.
    affects: [session_dating]

  - id: graduate-then-retire
    date: 2026-07-26
    summary: >-
      Names swapped — you GRADUATE (recurring spot check), then you RETIRE (terminal).
      The labels were originally the other way round.
    affects: [intervals, comfort_scale]

  - id: remaining-board-source-fix
    date: 2026-09-18
    summary: >-
      A "what's left / what else / what's next / remaining" restate is now DERIVED by
      scripts/remaining.py from the schedule's un-struck rows, not hand-assembled into
      scripts/links.py. links.py takes numbers the coach supplies, so a restate built by
      RECALLING what's open can drop an item — done twice in one session Sep 17, 2026 (dropped
      560, then 721). remaining.py reads the current week's schedule, finds the session-date
      day-block, and prints the un-struck board as the same [file]·[LC] pairs via link_line, so
      it is spoiler-free and the name+links-only rule and the Stop-hook guard are unaffected.
      New coach rule: answer any "what's open now" question by running remaining.py, never from
      memory; keep links.py for a set you already hold exactly (post-scaffold kickoff, a single
      named hand-over). Skill-only rung (learner's call) — no hook. No cse.config.yml value
      changed. Strands any "build a restate lineup by hand into links.py" wording predating this.
      See references/scaffolding.md, feedback_lineup_links_only.md, self_eval_log 2026-09-17.
    affects: [scaffolding, lineup_links]

  - id: banned-openers-to-hook
    date: 2026-09-19
    summary: >-
      The banned-openers rule (feedback_explanation_register BANNED OPENERS, Aug 15) moved from PROSE to a
      Stop HOOK after lapsing >=2x (recurred mid-session: "Careful —", "Fair —", "Right —"). The learner
      paired it with the advance-tail hook: "remove the prefixing statements that don't add value like how
      we removed the ending statements." Enforcement now lives in
      problem_link_reminder.py::banned_opener (fires on Stop, no settings change) — the mirror of
      advance_prompt_tail at the START of the turn: it blocks an em-dash-dangle interjection ("<opener> —"),
      the "Right, so" continuation, and fixed throat-clears (So:, Worth noting, Here's the thing, Good
      question, but) at the start of the message OR any paragraph; a bare "So the invariant …" (no dangle)
      stays clean. Strands any wording that calls banned-openers a prose-only posture: it is now
      hook-enforced, and the normative sentence moved to SKILL.md §1 (Register). No cse.config.yml value
      changed. See SKILL.md §1, feedback_explanation_register.md.
    affects: [explanation_register, hooks]

  - id: gamification-progress-platform
    date: 2026-09-20
    summary: >-
      ADDS a gamification layer, surfaced as an honest-progress dashboard on
      progressiveoverflow.com. New source-tier tool scripts/gamify.py reads the records that
      already exist (dsa_progress.md, the weekly schedules, technique_coverage.md) and emits
      progress.json — a versioned, curated, public DATA CONTRACT (progress.schema.json) that the
      site renders; it carries aggregate stats, the maturation pipeline, the trophy case,
      technique coverage, an SR-honest study-day streak, per-problem comfort timelines, and
      derived badges, but NEVER solution code or stuck-log prose. Wired into .githooks/pre-commit
      (regenerate on a rep) and surfaced at session start by session_start_memory.py. The design
      invariant is HONEST PROCESS ONLY: every reward keys off a genuine, unfakeable event (a
      graduation = 3 cold cleans across spaced intervals, a retirement, a comeback, a study-day
      streak) — nothing rewards raw volume or a self-reported rating, so nothing pressures a
      dishonest 🟢. The streak is SR-honest (practice-when-due + a rest-day allowance) so it never
      pushes daily over-review against the effort budget. New tuned thresholds live ONLY in
      cse.config.yml `gamification:` (neutral keys — no blank/shaky/clean/graduated substrings);
      the badge catalog is content in gamify.py. Coaching behaviour (when/how to surface progress
      honestly) is references/motivation.md. Strands any wording that says the repo has no
      progress/celebration surface, or that "row count is never reported" without the nuance that
      the PIPELINE/trophy case (not row count) is the progress signal. See CLAUDE.md, SKILL.md §8,
      references/motivation.md.
    affects: [gamification, hooks, single_source, upstream]

  - id: typo-self-fix-not-a-real-fix
    date: 2026-09-20
    summary: >-
      CLARIFIES the boundary of the clean-code + Big-O-miss waiver (rule 4 /
      complexity-cleanup-formalized): "the code needed a real fix" — the clause that RE-CAPS a rep —
      means the LOGIC was wrong and had to be repaired. A typo the learner catches and fixes
      themselves, unprompted, on a non-logic line (a one-line pointer / index / bound) with no
      algorithm change and nobody else surfacing it is ordinary clean authoring: it does NOT cap the
      rating and does NOT break the waiver. The picking feature is WHO SURFACED IT + WHETHER LOGIC
      CHANGED — self-caught & logic-unchanged → clean; coach-/test-surfaced, or a fix that altered the
      algorithm → a real fix (→ 🟡). Left open on one rep (a no-op for that rep either way) and
      delegated to the coach. No cse.config.yml value changed. Strands any wording that reads the
      "real fix" clause as covering every edit-after-first-write, including a self-caught cosmetic
      slip. Operational home: rule 4 scope in complexity_gotchas.md; why/history:
      feedback_ask_complexity.md.
    affects: [complexity_gate, rating]

  - id: eow-close-out-process-sep20
    date: 2026-09-20
    summary: >-
      THREE standing changes to the Sunday end-of-week close-out (learner's call, Sep 20).
      (1) COMPLEXITY CHECKS CONSOLIDATED TO SUNDAY — the cold complexity probes no longer seed into
      weekday warmups; all complexity work (cleanup queue + ~2 probes) now fires in one focused block at
      the Sunday close-out, so weekday boards carry none and the daily tables stay leaner.
      (2) SELF-EVAL META-REVIEW + SKILL-UPDATE EVALUATION is now a standing Sunday pass: run
      meta_review_digest.py, consolidate resolved entries into self_eval_archive.md, and decide any
      skill/CLAUDE.md updates the open entries warrant IN THAT PASS (the log gets drained on Sunday, not
      just appended to). (3) TABLE-SCANNABILITY guardrail — the daily schedule table's Note column
      carries a short tag only; full per-rep rationale lives in the mastery ledgers, never the board; an
      overloaded table is a build defect. No cse.config.yml value changed. Strands any wording that seeds
      complexity probes into weekday warmups, or that keeps full rep rationale in the board table.
      Operational home: references/weekly-build.md.
    affects: [weekly_build, complexity_gate, self_evaluation]

  - id: schedule-item-kind-tags-sep21
    date: 2026-09-21
    summary: >-
      ADDS two ADDITIVE fields to the progress.json schedule-item contract (dashboard/progress.schema.json,
      scripts/gamify.py): `tags` (the row's build-time tag glyphs, named — protected/backfill/new/probe/
      variant/primer/moved) and `kind` (rep|new|probe|complexity|primer — the single most-specific
      classification of the row). `kind` checks `complexity` BEFORE any tag: the Sunday complexity re-ask
      rows are also 🎯-tagged, but Technique="Complexity" is the more specific fact, and this is the site's
      half of the eow-close-out-process-sep20 complexity-consolidation decision — the dashboard now
      surfaces which rows are that consolidated Sunday block rather than showing them as an ordinary
      probe. Both fields are additive only; the six existing required fields (lcNumber, title, technique,
      startComfort, difficulty, done) are unchanged, so nothing that already reads the prior contract
      breaks. Also hardened lcNumber/url extraction with a bare-number fallback so a 🆕 intake row (no
      `[`/`**` before its number — no local file to link yet) still yields a real lcNumber/url off its own
      row instead of nulling both out. No cse.config.yml value changed. Strands any wording that says a
      schedule item carries only the original six fields, or that a 🆕 row's lcNumber/url is
      unconditionally null. See dashboard/progress.schema.json, scripts/gamify.py.
    affects: [gamification, scheduling]

  - id: coach-gamification-promoted-sep21
    date: 2026-09-21
    summary: >-
      WAIVES the soak period gamification-progress-platform (Sep 20) set for scripts/gamify.py +
      progress.schema.json as a "new instrument". The schema + generator make any adopter repo
      site-renderable — that promise stays FALSE for every other adopter until the generator itself
      ships to canonical cse-coach, and a soak that never uploads it keeps deferring the one thing the
      promise depends on. The generator is reclassified from "soaking instrument" to SHIPPED, alongside
      the Sep 21 schedule-item-kind-tags contract addition. Does NOT waive soak for anything else in the
      gamification feature — a display/curation round on the consuming site is unaffected by this
      waiver. No cse.config.yml value changed. Strands any wording that still calls
      gamify.py/progress.schema.json a soaking instrument or not-yet-upstream-eligible.
    affects: [gamification, scheduling]

  - id: learn-cheatsheet-contract-sep22
    date: 2026-09-22
    summary: >-
      The 18 technique docs (docs/foundations/dsa/patterns/techniques/) gained a machine-read
      markdown contract — five exact headings (When to reach for it / Picking feature /
      Template: <title> + a Complexity line / Common pitfalls / Practice) — parsed by the new
      scripts/build_cheatsheets.py into dashboard/cheat-sheets.json (the schema itself,
      cheat-sheets.schema.json, is copied verbatim from scripts/fixtures/ alongside it), the
      same source-tier/dashboard-tier split gamify.py established for progress.json.
      scripts/check_cheatsheets.py --check validates the contract, wired report-only in
      pre-commit (like check_single_source.py) until all 18 docs pass. techniques.yml gained a
      `doc:` join key (one entry per technique doc) so family/tier resolve without a second
      copy of that vocabulary. progressiveoverflow.com/learn renders this file. No
      cse.config.yml value changed. Strands any wording that still calls /learn's cheat sheet
      hand-maintained, or that says the technique docs carry no machine-read contract, or that
      the docs' Picking-feature/notWhen/per-variant-complexity content doesn't exist yet. See
      scripts/build_cheatsheets.py, scripts/check_cheatsheets.py.
      2026-09-23: all 18 docs pass, so scripts/check_cheatsheets.py --check is promoted from
      report-only to blocking in pre-commit as of the commit landing this follow-up.
    affects: [gamification]

  - id: schedule-item-end-status-sep23
    date: 2026-09-23
    summary: >-
      ADDS three ADDITIVE fields to the progress.json schedule-item contract (dashboard/progress.schema.json,
      scripts/gamify.py): `endComfort` (the first comfort glyph in the row's E cell, or null — never falling
      back to startComfort, so the board shows only what was actually earned this rep, not the start comfort
      carried forward as if it were the outcome), `endNote` (the E cell's free-form note after its glyph,
      stripped/collapsed/lowercased, maxLength 16 — vocabulary seen in real weeks: s0, s1, s2, prov,
      dropped — emitted ONLY when endComfort is non-null, null otherwise even if the raw cell had trailing
      text), and `nextReview` (the row's Next cell iff, once stripped, it is nothing but an ISO date; null
      for a free-form or blank Next cell). Closes the gap where a board row showed a rep was done but never
      how it ended — the E glyph and Next date were already parsed for the comfort timeline
      (`_scan_week`/`build_schedule_index`) but never emitted on the board slice
      (`_parse_schedule_day_full`). `_scan_week`'s own End-glyph read is refactored onto the same new
      `_end_glyph()` helper (with its start-glyph fallback preserved there — only the board slice refuses
      the fallback), and the new `_schedule_item_outcome()` helper is self-contained (only `eb.GLYPH` + `re`)
      so it ports verbatim to `cse-coach/scripts/gamify.py`. All three fields are additive only; the six
      existing required fields (lcNumber, title, technique, startComfort, difficulty, done) are unchanged,
      so nothing that already reads the prior contract breaks. No `cse.config.yml` value changed. Strands
      any wording that says a board/schedule item carries only its start comfort, or that the E
      glyph/Next date are parsed only for the comfort timeline and never exposed on the board. See
      `dashboard/progress.schema.json`, `scripts/gamify.py`.
    affects: [gamification, scheduling]

  - id: output-quality-standard-sep25
    date: 2026-09-25
    summary: >-
      ADDS an output-quality standard for every coaching turn: four dimensions (F1, groundedness,
      narrative quality, readability), a turn shape (one message, sent after the last tool call,
      with no text between tool calls except one short line before a long mechanical run), a
      per-moment content contract (required/forbidden items for an answer, a concept teach, a
      stuck hint, a rating proposal, a work report, a board/hand-over, a close-out report, an SD
      mock debrief), a groundedness Stop hook, and an LLM judge + eval suite. New files:
      `references/output-quality.md`, `.claude/hooks/grounded_claims.py`,
      `.claude/memory/feedback_output_quality.md`, `scripts/judge_output.py`, and
      `.claude/skills/cse-coach/evals/`. `cse.config.example.yml` gains an `output_quality:`
      block (`judge_model`, `pass_threshold`, `readability.max_sentence_words`); no existing
      key's value changed. Strands any wording that has the coach narrate progress mid-turn before the
      answer is complete, present a partial board or a tentative rating that gets revised later,
      or split one answer across several messages. Does NOT strand "lead with the spine, then
      stop and check in" (SKILL.md §1, AGENTS.md item 9) — that stop follows a COMPLETE spine
      answer and invites the learner's next move; it is not mid-turn narration. See
      `references/output-quality.md`, `feedback_output_quality.md`.
    affects: [turn_economy, token_discipline, self_evaluation, hooks, reporting]

  - id: dashboard-contract-exporters-oct6
    date: 2026-10-06
    summary: >-
      PROMOTES the dashboard data-contract exporters from the practice repo (reversing the Sep 23
      decline in `.coach-sync/declined.md`, which had kept the grounded-solutions tooling local as
      "a site concern"). New engine files: `scripts/export_showcase.py` (dashboard/showcase.yml ->
      showcase.json), `scripts/export_bigo.py` (bigo.yml -> big-o.json), `scripts/export_practice.py`
      (dsa/tests/*.yml -> practice.json), `scripts/dashboard_indexes.py` (practice-index.json,
      showcase-index.json, showcase/<lc>.json), `scripts/export_manifest.py` (manifest.json: sha256 +
      size of every dashboard JSON), `scripts/contract_schema.py` (validates every payload against
      its `dashboard/*.schema.json`, resolving `$ref` by `$id` from disk), a `test_*.py` for each,
      the seven schemas (showcase, big-o, practice, practice-index, showcase-index, showcase-problem,
      manifest) and `requirements.txt` (jsonschema, pyyaml); the schemas and requirements.txt are
      named in `coach_sync.ENGINE_PATHS`. The pre-commit hook gains a `run_py` helper and the
      showcase / Big-O / practice / manifest blocks: each regenerates its output and then runs
      `--check`, where exit 1 (drift) stays report-only and exit 2 (a payload that violates its
      schema) stops the commit. Rules this adds. (1) An EMPTY manifest is nothing to export, not an
      empty file: `export_showcase.py` and `export_bigo.py` exit 0 with a one-line notice and write
      no showcase.json / big-o.json, because the site falls back to the author's data only when the
      adopter's file is a 404 and an empty generated file would hide that fallback. Canonical
      ships `dashboard/showcase.yml` and `dashboard/bigo.yml` empty (`entries: []`); they are
      learner-owned and not in `ENGINE_PATHS`. (2) The manifest and index exporters tolerate any of
      those outputs being absent. (3) A missing `complexity_gotchas.md` means no misses
      (`isMiss` false), not an error. No `cse.config.yml` value changed. Strands any wording that
      says the showcase / Big-O / practice contracts are practice-repo-only, or that a dashboard
      schema violation never blocks a commit. See `scripts/export_showcase.py`, `scripts/export_bigo.py`,
      `.githooks/pre-commit`.
    affects: [gamification, hooks, dashboard]

  - id: gamify-parity-oct6
    date: 2026-10-06
    summary: >-
      PROMOTES `scripts/gamify.py`, `dashboard/progress.schema.json` and `scripts/test_gamify.py` to
      parity with the practice repo. gamify.py gains schedule history (`dashboard/schedule-history.json`,
      every archived + live week), the per-day `workload` series (priced under the CURRENT config
      weights via `effort_budget.price_day_items`), the Waiting Room / roadmap `planned` lists and
      `plannedTotal` per technique, `buildsOn` / `graduatedCount` / `untriedVariations` /
      `coverageFloor` / `uncleanCount` enrichment, per-item `file` and `deferredTo`, and `progress`
      on counter badges. Carried with it: `effort_budget.py` gains `parse_sched_line`,
      `price_day_items`, `deferred_to`, `sched_row_number`, `is_complexity_technique` and the
      untracked-difficulty lookup (its `Hard` default stays the config's, not the practice
      repo's tuned value), and `links.py` gains `solution_files()`. The schema's `schedule`
      property now points at `definitions/scheduleWeek` (`weekOf`, `days`); the old inline
      `schedule.days` / `schedule.weekOf` / `schedule.required` are gone (`schemaVersion` stays 1:
      every added field is optional, and a viewer reading `schedule.days` and `schedule.weekOf`
      finds them in the same place). The pre-commit GAMIFY block now also fires when `gamify.py` or
      `effort_budget.py` is staged, stages `dashboard/schedule-history.json`, and stops the commit
      on exit 2 (a payload that violates the schema), staying report-only on any other failure.
      A fresh adopter has no `roadmap.yml`, schedule files, Waiting Room or coverage report yet:
      each of those degrades to an empty array / null field (with a visible warning where the
      file is expected) rather than raising, and the tests build their repos from inline
      fixtures, never from the checkout's own data. No `cse.config.yml` value changed. Strands any
      wording that says gamify.py emits no schedule history or workload series, that the schema's
      `schedule` is an inline object, or that a progress.json schema violation never blocks a
      commit. See `scripts/gamify.py`, `dashboard/progress.schema.json`, `.githooks/pre-commit`.
    affects: [gamification, hooks, dashboard]

  - id: release-v0-8-0-oct6
    date: 2026-10-06
    summary: >-
      RELEASES v0.8.0 (VERSION bumped from 0.7.0, `.coach-sync/manifest.json` re-emitted; the
      annotated `v0.8.0` tag is the maintainer's step, per CLAUDE.md "Releasing"). It ships three
      things already decided, each recorded under its own id and not restated here. (1) The
      dashboard contract exporters, their seven schemas and the pre-commit gate where exit 2 (a
      payload that violates its schema) stops the commit: `dashboard-contract-exporters-oct6`.
      (2) Empty starter manifests (`dashboard/showcase.yml`, `dashboard/bigo.yml`) that write
