  - id: practice-contract-shapes
    date: 2026-10-02
    summary: >-
      ADDS three optional shapes to a practice spec: `result` (compare an argument after the call,
      whole or its first k items), `types` (list-node, list-node-cycle, random-list, tree-node,
      tree-value, graph-node codecs per argument and result), and `entry.kind` (`ops` for a design
