name: Rebuild demo

# Regenerates the public demo repo (michael-yrao/progressive-overflow-demo) from the template
# whenever the engine or curriculum changes, and pushes only if the output differs.
#
# Guard: this file syncs to learner repos through .github/workflows/*.yml, where it must never
# run, so the job only runs in the template repo (the same guard ci.yml uses).
#
# Secret DEMO_DEPLOY_KEY: an SSH deploy key with write access on the demo repo only.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'curriculum/**'
      - 'dashboard/*.schema.json'
      - 'dashboard/*.yml'
      - 'docs/foundations/**'
      - 'cse.config.example.yml'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo
  cancel-in-progress: true

jobs:
  rebuild:
    if: ${{ github.event.repository.is_template }}
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: coach

      # A sibling of the template: make_demo_repo.py refuses an --out inside it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: michael-yrao/progressive-overflow-demo
          path: demo
          ssh-key: ${{ secrets.DEMO_DEPLOY_KEY }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - run: pip install -r coach/requirements.txt

      - run: python coach/scripts/demo/make_demo_repo.py --out demo --seed 7

      - name: Commit and push if changed
        shell: bash
        working-directory: demo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "demo already up to date"
            exit 0
          fi
          day=$(date -u +%F)
          git commit -m "chore: synthetic demo learner (generated by cse-coach scripts/demo/make_demo_repo.py, seed 7, today $day)"
          git push
